  --ease-out:cubic-bezier(.32,.72,0,1);
  /* semantic aliases — Apple-style naming over the Nightblood palette */
  --label-1:var(--fg);--label-2:var(--fg-2);--label-3:var(--fg-3);
  --separator:rgba(242,222,192,.14);--separator-strong:rgba(242,222,192,.26);
  --surface-1:rgba(10,7,11,.72);

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
html{background:var(--night-0);}
body{
  min-height:100vh;color:var(--text-1);
  font-family:var(--font-ui);font-size:var(--ts-body);font-weight:400;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);display:flex;justify-content:center;
  background:
    radial-gradient(ellipse 80% 55% at 50% -10%, rgba(51,18,27,.8) 0%, transparent 62%),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(140,26,34,.28) 0%, transparent 60%),
    linear-gradient(180deg, var(--night-1) 0%, var(--night-0) 70%);
  background-attachment:fixed;
  transition:background 1.2s ease;
}
body[data-phase="day"]{
  background:
    radial-gradient(ellipse 80% 55% at 50% -10%, rgba(160,64,44,.34) 0%, transparent 62%),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(140,26,34,.2) 0%, transparent 60%),
    linear-gradient(180deg, #241018 0%, var(--night-0) 70%);
}
.serif{font-family:var(--font-display);letter-spacing:1px;font-weight:400;}
.ui{font-family:var(--font-ui);}
#app{width:100%;max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding:0 0 calc(env(safe-area-inset-bottom) + 96px);transition:max-width .15s ease;z-index:1;}

/* ---------- Night sky layer ---------- */
#sky{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
#sky .field{position:absolute;inset:-6%;animation:drift 260s linear infinite alternate;}
#sky .star{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--gold-2);opacity:var(--o,.6);box-shadow:0 0 6px rgba(232,211,154,.6);animation:twinkle var(--d,4s) ease-in-out var(--dl,0s) infinite alternate;}
#sky .star.big{width:3px;height:3px;}
#sky svg{position:absolute;inset:0;width:100%;height:100%;}
#sky svg line{stroke:var(--gold);stroke-width:.7;opacity:.32;stroke-dasharray:600;stroke-dashoffset:600;animation:drawLine 3.2s var(--ease-out) forwards;}
#sky svg circle{fill:var(--gold-2);opacity:.8;}
#sky .moon{position:absolute;top:calc(env(safe-area-inset-top) + 148px);right:-16px;width:176px;height:176px;border-radius:50%;
  background:var(--moon-img) center/contain no-repeat;
  box-shadow:0 0 70px rgba(194,42,49,.55);
  transition:filter 1.4s ease, box-shadow 1.4s ease, transform 1.4s var(--ease-out), opacity 1.4s ease;opacity:.85;animation:moonPulse 7s ease-in-out infinite;}
body[data-phase="day"] #sky .moon{background:var(--moon-img) center/contain no-repeat;filter:brightness(1.25) saturate(1.25) hue-rotate(-8deg);box-shadow:0 0 90px rgba(242,193,78,.4);opacity:.8;}
body[data-phase="day"] #sky .star{opacity:calc(var(--o,.6) * .35);}
@keyframes twinkle{from{opacity:calc(var(--o,.6) * .35);transform:scale(.8);}to{opacity:var(--o,.6);transform:scale(1.15);}}
@keyframes moonPulse{0%,100%{box-shadow:0 0 60px rgba(194,42,49,.45);}50%{box-shadow:0 0 100px rgba(194,42,49,.65);}}
@keyframes drift{from{transform:translate3d(0,0,0);}to{transform:translate3d(-2.5%,1.5%,0);}}
@keyframes drawLine{to{stroke-dashoffset:0;}}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;display:flex;align-items:center;gap:2px;
  background:var(--surface-1);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  border-bottom:1px solid transparent;transition:background .2s ease,border-color .2s ease;}
.topbar.scrolled{background:rgba(8,5,9,.9);border-bottom-color:var(--separator);}
/* constellation ornament removed from the functional layer */
.topbar .chevron{font-size:26px;line-height:1;margin-top:-3px;}
.topbar .backlabel{font-size:var(--ts-headline);}
.topbar .back{min-height:var(--tap);padding:0 10px 0 2px;display:inline-flex;align-items:center;gap:2px;background:transparent;border:none;border-radius:10px;
  color:var(--tint-text);font-family:var(--font-ui);font-size:var(--ts-headline);font-weight:400;flex:none;cursor:pointer;transition:background .15s ease;}
.topbar .back:active{background:rgba(242,222,192,.12);}
.topbar .back:active{transform:scale(.9);background:var(--fill-strong);}
.topbar h1{font-family:var(--font-ui);font-size:var(--ts-headline);font-weight:600;letter-spacing:0;margin:0;flex:1;text-align:center;color:var(--label-1);padding-right:64px;}

/* ---------- Sections / hero ---------- */
.section{padding:18px 20px;}
.hero{padding:44px 24px 12px;position:relative;}
.hero::before{content:'';position:absolute;right:16px;top:18px;width:86px;height:86px;background:var(--emblem) center/cover no-repeat;border-radius:20px;border:2px solid rgba(194,42,49,.7);box-shadow:0 12px 32px rgba(0,0,0,.55), 0 0 26px rgba(194,42,49,.35), inset 0 0 0 3px rgba(10,8,12,.35);pointer-events:none;z-index:2;animation:emblemIn 1.6s var(--ease-out) both;}
.hero .kicker{font-family:var(--font-ui);font-size:12.5px;color:#E1545B;letter-spacing:5px;margin-bottom:12px;font-weight:600;text-shadow:0 0 12px rgba(194,42,49,.6);}
.hero::after{content:'';position:absolute;left:16px;bottom:4px;width:110px;height:52px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 110 52'><g stroke='%23C22A31' stroke-width='7' stroke-linecap='round' fill='none' opacity='.28'><path d='M18 8C30 22 40 34 48 46'/><path d='M44 6C56 20 66 32 74 44'/><path d='M70 12C80 24 88 34 94 44'/></g></svg>") center/contain no-repeat;pointer-events:none;transform:rotate(-6deg);}
.hero h1{font-family:var(--font-display);font-size:46px;line-height:1.2;margin:0 0 10px;font-weight:400;color:var(--gold-2);letter-spacing:3px;text-shadow:0 2px 0 rgba(0,0,0,.5), 0 0 30px rgba(194,42,49,.55), 0 0 60px rgba(194,42,49,.25);}
.hero p{color:var(--label-2);font-size:var(--ts-subhead);line-height:1.6;margin:0;max-width:34ch;}
@keyframes emblemIn{from{opacity:0;transform:rotate(-6deg) scale(.9);}to{opacity:1;transform:none;}}

/* ---------- Parchment decree card ---------- */
.card{
  --fg:var(--ink);--fg-2:var(--ink-2);--fg-3:#6A5A3E;
  --hair:rgba(90,66,20,.38);--hair-strong:rgba(90,66,20,.6);
  --separator:rgba(90,66,20,.24);
  --fill:rgba(60,40,10,.07);--fill-strong:rgba(60,40,10,.13);
  --accent:var(--gold-3);--accent-2:#6B4F12;
  --moon:var(--gold-3);--wolf:#A32830;--good:#2E5D49;--special:#7055A8;
  --wolf-soft:rgba(142,37,32,.14);--moon-soft:rgba(138,106,30,.16);--good-soft:rgba(36,70,58,.14);--special-soft:rgba(94,69,143,.14);
  --text-1:var(--fg);--text-2:var(--fg-2);--text-3:var(--fg-3);--glass:var(--fill);--glass-strong:var(--fill-strong);--glass-border:var(--hair);--line:var(--hair);
  position:relative;color:var(--fg);
  background:var(--noise), linear-gradient(160deg, #F0E2BF 0%, var(--parch) 45%, var(--parch-2) 100%);
  border-radius:var(--radius);padding:18px 16px;margin-bottom:16px;
  box-shadow:0 18px 38px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -14px 24px rgba(120,90,40,.12);
}
.card::before{content:'';position:absolute;inset:7px;border:1px solid rgba(150,48,50,.55);border-radius:3px;pointer-events:none;
  background:var(--star) -4px -4px/9px 9px no-repeat, var(--star) calc(100% + 4px) -4px/9px 9px no-repeat, var(--star) -4px calc(100% + 4px)/9px 9px no-repeat, var(--star) calc(100% + 4px) calc(100% + 4px)/9px 9px no-repeat;}
/* decorative card seal removed: it collided with in-card controls on tall cards */
.card>*{position:relative;}
.card-strong{background:var(--noise), linear-gradient(160deg, #E6D3A6 0%, var(--parch-2) 50%, var(--parch-3) 100%);}
.card-title{font-family:var(--font-ui);font-size:var(--ts-footnote);font-weight:600;color:var(--fg-2);margin:0 0 12px;letter-spacing:.5px;display:flex;align-items:center;gap:10px;}
.card-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--separator-strong,var(--separator)),transparent);}

/* ---------- Buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--radius-sm);padding:14px 18px;min-height:50px;
  font-family:var(--font-ui);font-size:var(--ts-headline);font-weight:600;letter-spacing:0;
  border:1px solid var(--hair-strong);background:var(--fill-strong);color:var(--fg);cursor:pointer;width:100%;position:relative;overflow:hidden;
  transition:transform .14s var(--ease-out), box-shadow .2s, background .2s, filter .2s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,#C22A31 0%,#961A22 55%,#5E0F14 100%);border:1px solid rgba(242,222,192,.65);color:#F7E8CE;box-shadow:0 12px 30px rgba(194,42,49,.5), inset 0 1px 0 rgba(255,255,255,.2);text-shadow:0 1px 0 rgba(0,0,0,.45);}
.btn-gold{background:linear-gradient(135deg,#F1E1AE 0%,#C9A24A 50%,#A47C28 100%);border:1px solid rgba(255,244,210,.7);color:#2A1E08;box-shadow:0 12px 30px rgba(201,162,74,.35), inset 0 1px 0 rgba(255,255,255,.45);}
.btn-primary::after,.btn-gold::after{content:'';position:absolute;top:-40%;bottom:-40%;left:-30%;width:26%;background:linear-gradient(105deg, transparent 0%, rgba(255,240,200,.0) 30%, rgba(255,240,200,.55) 50%, rgba(255,240,200,0) 70%, transparent 100%);transform:skewX(-18deg);animation:shimmer 3.6s ease-in-out 1.2s infinite;pointer-events:none;}
@keyframes shimmer{0%{left:-40%;}40%,100%{left:130%;}}
.btn-ghost{background:transparent;border:1px solid var(--hair-strong);color:var(--fg);}
.btn-sm{padding:10px 16px;min-height:var(--tap);font-size:var(--ts-subhead);font-family:var(--font-ui);letter-spacing:0;font-weight:600;border-radius:var(--radius-sm);width:auto;}
.btn-danger-outline{border:1px solid rgba(222,78,86,.7);color:#DE4E56;background:transparent;}
.btn[disabled]{opacity:0.45;pointer-events:none;filter:saturate(.35);border-style:dashed;}
.btn[disabled]::after{display:none;}
.row{display:flex;gap:10px;}

/* ---------- Chips (wax-stamp buttons) ---------- */
.grid-chips{display:flex;flex-wrap:wrap;gap:9px;}
.chip{padding:10px 16px;min-height:var(--tap);border-radius:var(--radius-sm);border:1px solid var(--hair-strong);background:var(--fill);color:var(--fg);font-size:var(--ts-subhead);cursor:pointer;font-weight:500;font-family:var(--font-ui);transition:transform .14s var(--ease-out), background .2s, color .2s, box-shadow .2s;position:relative;}
.chip:active{transform:scale(.95);}
.chip.active{background:linear-gradient(135deg,#C22A31,#7E141B);border-color:rgba(242,222,192,.7);color:#F7E8CE;box-shadow:0 6px 18px rgba(194,42,49,.45);}
.chip.gold.active{background:linear-gradient(135deg,#F1E1AE,#C9A24A);border-color:rgba(255,244,210,.7);color:#2A1E08;box-shadow:0 6px 18px rgba(201,162,74,.35);}
.chip.special.active{background:linear-gradient(135deg,#B9A2E6,#6E52A8);border-color:rgba(232,220,255,.6);color:#1E1433;box-shadow:0 6px 18px rgba(110,82,168,.35);}
.chip.sm{padding:10px 15px;min-height:var(--tap);font-size:var(--ts-subhead);}
.empty{text-align:center;padding:50px 20px;color:var(--text-3);font-family:var(--font-display);font-size:17px;letter-spacing:2px;line-height:1.9;}
.empty .glyph{font-size:34px;margin-bottom:10px;filter:sepia(.6) saturate(.5) drop-shadow(0 0 12px rgba(201,162,74,.45));}

/* ---------- List items (small parchment strips) ---------- */
.list-item{
  --fg:var(--ink);--fg-2:var(--ink-2);--fg-3:var(--ink-3);--separator:rgba(90,66,20,.24);--hair:rgba(90,66,20,.38);--hair-strong:rgba(90,66,20,.6);--fill:rgba(60,40,10,.07);--fill-strong:rgba(60,40,10,.13);
  --moon:var(--gold-3);--wolf:#A32830;--good:#2E5D49;--special:#7055A8;--wolf-soft:rgba(142,37,32,.14);--moon-soft:rgba(138,106,30,.18);--good-soft:rgba(36,70,58,.14);--special-soft:rgba(94,69,143,.14);
  --text-1:var(--fg);--text-2:var(--fg-2);--text-3:var(--fg-3);--glass:var(--fill);--glass-strong:var(--fill-strong);--glass-border:var(--hair);--line:var(--hair);
  display:flex;align-items:center;gap:12px;min-height:52px;padding:11px 16px;border-radius:var(--radius);color:var(--fg);
  background:var(--noise), linear-gradient(160deg,#EEDDB6,var(--parch-2));margin-bottom:12px;cursor:pointer;position:relative;
  box-shadow:0 10px 24px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.3);
  transition:transform .15s var(--ease-out), box-shadow .2s;}
.list-item:active{transform:scale(.985);box-shadow:0 6px 14px rgba(0,0,0,.4);}
.badge{width:40px;height:40px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:400;flex:none;font-family:var(--font-ui);border:1px solid var(--hair);}
.badge.wolf{background:var(--wolf-soft);color:var(--wolf);border-color:rgba(142,37,32,.4);}
.badge.god{background:var(--moon-soft);color:var(--moon);border-color:rgba(201,162,74,.5);}
.badge.villager{background:var(--fill);color:var(--fg-2);}
.badge.special{background:var(--special-soft);color:var(--special);border-color:rgba(110,82,168,.4);}
.li-main{flex:1;min-width:0;}
.li-title{font-size:var(--ts-headline);font-weight:600;}
.li-sub{font-family:var(--font-ui);font-size:var(--ts-footnote);color:var(--fg-2);margin-top:3px;}
.tag{font-family:var(--font-ui);font-size:var(--ts-caption);font-weight:500;padding:3px 9px;border-radius:6px;background:var(--fill-strong);color:var(--fg-2);border:1px solid var(--hair);letter-spacing:0;}
.tag.win-good{background:var(--good-soft);color:var(--good);border-color:transparent;}
.tag.win-wolf{background:var(--wolf-soft);color:var(--wolf);border-color:transparent;}

/* ---------- Inputs ---------- */
input[type=text], select, textarea{width:100%;min-height:var(--tap);padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--hair-strong);background:var(--fill);color:var(--fg);font-size:var(--ts-headline);font-family:var(--font-ui);transition:border-color .2s, box-shadow .2s;}
input[type=text]:focus, select:focus, textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,162,74,.18);}
.card input[type=text], .card select, .card textarea{background:rgba(255,250,235,.45);}
textarea{resize:vertical;min-height:80px;}
input::placeholder, textarea::placeholder{color:var(--fg-2);opacity:.75;}
.field{margin-bottom:12px;}
.field label{font-family:var(--font-ui);font-size:var(--ts-footnote);color:var(--fg-2);display:block;margin-bottom:6px;letter-spacing:0;}

/* ---------- Steppers ---------- */
.stepper-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:8px 2px;border-bottom:1px solid var(--separator);}
.stepper-row:last-child{border-bottom:none;}
.stepper-name{font-size:var(--ts-headline);font-weight:600;}
.stepper-name .role-desc{display:block;font-family:var(--font-ui);font-size:11.5px;color:var(--fg-3);font-weight:400;margin-top:2px;}
.stepper-ctrl{display:flex;align-items:center;gap:12px;}
.stepper-btn{width:var(--tap);height:var(--tap);border-radius:50%;background:var(--fill-strong);border:1px solid var(--hair-strong);color:var(--fg);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s var(--ease-out), background .2s;}
.stepper-btn:active{transform:scale(.88);background:var(--accent);color:#fff;}
.stepper-val{min-width:34px;text-align:center;font-weight:600;font-size:var(--ts-headline);font-family:var(--font-ui);}

/* ---------- Seat grid (engraved seat plates) ---------- */
.seat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
.seat-tile{aspect-ratio:1;border-radius:var(--radius-sm);background:var(--fill);border:1px solid var(--hair-strong);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:2px;font-size:var(--ts-caption);color:var(--fg-2);position:relative;text-align:center;transition:transform .16s var(--ease-out), background .2s, box-shadow .2s, color .2s;}
.seat-tile:active{transform:scale(.93);}
.seat-tile.selected{background:linear-gradient(135deg,#C22A31,#7E141B);border-color:rgba(242,222,192,.85);color:#F7E8CE;box-shadow:0 0 0 0 rgba(242,222,192,.6);animation:seatPulse 1.6s ease-out infinite;}
.seat-tile.selected .num{color:var(--gold-2);}
@keyframes seatPulse{0%{box-shadow:0 0 0 0 rgba(193,41,48,.6), 0 8px 20px rgba(194,42,49,.45);}70%{box-shadow:0 0 0 9px rgba(193,41,48,0), 0 8px 20px rgba(194,42,49,.45);}100%{box-shadow:0 0 0 0 rgba(193,41,48,0), 0 8px 20px rgba(194,42,49,.45);}}
.seat-tile.dead{opacity:0.42;filter:grayscale(.6);}
.seat-tile.dead::after{content:'✕';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--wolf);opacity:.35;font-family:var(--font-display);pointer-events:none;}
.seat-tile .num{font-size:22px;font-weight:400;font-family:var(--font-display);color:var(--fg);line-height:1;}
.seat-tile .nm{font-family:var(--font-ui);font-size:var(--ts-caption2);max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.seat-tile .crown{position:absolute;top:3px;right:5px;font-size:11px;}
.seat-tile .icontag{position:absolute;top:3px;left:5px;font-size:11px;}

/* ---------- Phase banner ---------- */
.phase-banner{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:var(--radius);margin-bottom:16px;position:relative;overflow:hidden;
  background:linear-gradient(135deg, rgba(194,42,49,.26), rgba(120,22,28,.12) 70%, rgba(18,10,18,.7));border:1px solid var(--hair-strong);box-shadow:0 14px 34px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.08);}
.phase-banner::after{content:'';position:absolute;left:14px;right:14px;bottom:4px;height:12px;background:var(--constellation) center/100% 12px no-repeat;opacity:.7;pointer-events:none;}
.phase-banner.night{background:linear-gradient(135deg, rgba(51,18,27,.9), rgba(12,8,16,.94) 70%);border-color:var(--hair);}
.phase-banner .icon{font-size:30px;filter:sepia(.4) saturate(1.1) drop-shadow(0 0 10px rgba(242,222,192,.55));}
.phase-banner .t1{font-family:var(--font-display);font-size:26px;font-weight:400;letter-spacing:3px;color:var(--gold-2);text-shadow:0 0 16px rgba(201,162,74,.35);line-height:1.15;}
.phase-banner .t2{font-family:var(--font-ui);font-size:var(--ts-footnote);color:var(--label-2);margin-top:3px;letter-spacing:0;}

/* ---------- Role hero (tarot plate) ---------- */
.role-hero{text-align:center;padding:18px 0 22px;position:relative;}
.role-hero::before{content:'';position:absolute;left:50%;top:-24px;width:230px;height:230px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle, rgba(194,42,49,.34) 0%, rgba(126,20,27,.14) 55%, transparent 72%);box-shadow:0 0 80px rgba(194,42,49,.22);pointer-events:none;}
.role-hero .rb{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:400;font-family:var(--font-display);border:1px solid var(--hair-strong);box-shadow:0 0 0 5px rgba(5,6,15,.6), 0 0 0 6px var(--hair), 0 10px 28px rgba(0,0,0,.5);position:relative;}
.role-hero h2{font-family:var(--font-display);font-size:30px;margin:0 0 8px;font-weight:400;letter-spacing:4px;color:var(--accent-2);text-shadow:0 0 18px rgba(201,162,74,.35);position:relative;}
.card .role-hero h2{text-shadow:0 1px 0 rgba(255,255,255,.4);}
.card .role-hero::before{opacity:.3;filter:none;mix-blend-mode:multiply;}
.card .role-hero .rb{box-shadow:0 0 0 5px rgba(234,217,176,.9), 0 0 0 6px var(--hair-strong), 0 10px 22px rgba(0,0,0,.25);}
.role-hero p{color:var(--label-2);font-size:var(--ts-footnote);margin:0 auto;line-height:1.6;max-width:36ch;position:relative;}

/* ---------- Strips / blocks ---------- */
.info-strip{padding:12px 14px;border-radius:var(--radius-sm);background:var(--fill);border:1px solid var(--separator-strong,var(--separator));font-family:var(--font-ui);font-size:var(--ts-footnote);color:var(--fg-2);margin-bottom:14px;line-height:1.55;}
.warn-strip{border-color:rgba(194,74,60,.55);color:#E3A29A;background:rgba(158,43,37,.1);}
.card .warn-strip{color:#8E2520;background:rgba(142,37,32,.08);}
.divider{height:12px;background:var(--constellation) center/100% 12px no-repeat;margin:18px 0;opacity:.9;}
.say-block{padding:14px 16px 14px 18px;border-radius:var(--radius-sm);background:var(--fill);border:1px solid var(--separator);border-inline-start:3px solid var(--accent);font-size:var(--ts-subhead);color:var(--fg);margin-bottom:16px;line-height:1.7;position:relative;}
.say-block::before{content:'“';position:absolute;right:12px;top:-6px;font-family:var(--font-display);font-size:44px;color:var(--accent);opacity:.35;line-height:1;}
.say-block b{color:var(--accent);font-weight:700;}
.vote-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--hair);}
.vote-row:last-child{border-bottom:none;}
.vote-row .who{width:78px;flex:none;font-size:14px;font-weight:700;}
.vote-row select{flex:1;}
.steplink{color:var(--tint-text);font-weight:600;font-family:var(--font-ui);font-size:var(--ts-subhead);min-height:var(--tap);margin-bottom:10px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;letter-spacing:0;}
.linkbtn{color:var(--tint-text);font-weight:600;font-family:var(--font-ui);font-size:var(--ts-subhead);min-height:var(--tap);display:flex;align-items:center;justify-content:center;padding:10px;cursor:pointer;letter-spacing:0;}
.small-x{width:var(--tap);height:var(--tap);border-radius:50%;background:transparent;border:none;color:var(--fg-3);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex:none;transition:background .15s ease;}
.small-x:active{background:rgba(60,40,10,.12);}
.loglines{font-family:var(--font-ui);font-size:var(--ts-footnote);color:var(--fg-2);line-height:1.75;}
.loglines b{color:var(--fg);}
.grouplabel{font-family:var(--font-ui);font-size:var(--ts-caption);color:var(--fg-3);letter-spacing:.5px;margin:16px 4px 8px;font-weight:600;}
::-webkit-scrollbar{display:none;}

/* ---------- Toast (small decree) ---------- */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 28px);transform:translateX(-50%);z-index:100;
  background:var(--noise), linear-gradient(160deg,#F0E2BF,var(--parch-2));color:var(--ink);border:1px solid rgba(90,66,20,.3);outline:3px solid rgba(8,6,12,.6);
  padding:12px 20px;border-radius:var(--radius-sm);font-family:var(--font-ui);font-size:var(--ts-subhead);font-weight:500;box-shadow:0 14px 34px rgba(0,0,0,.55);max-width:86%;text-align:center;animation:toastIn .3s var(--ease-out) both, toastOut .3s ease-in 1.7s both;}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px) scale(.96);}to{opacity:1;transform:translate(-50%,0) scale(1);}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,8px);}}

/* ---------- View & card entrance ---------- */
@keyframes viewIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
@keyframes unfurl{0%{opacity:0;transform:translateY(10px);clip-path:inset(0 0 100% 0 round 12px);}60%{opacity:1;}100%{opacity:1;transform:none;clip-path:inset(0 0 0 0 round 12px);}}
@keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
#app.enter .topbar{animation:viewIn .4s var(--ease-out) both;}
#app.enter .hero,#app.enter .phase-banner,#app.enter .role-hero,#app.enter .empty{animation:viewIn .45s var(--ease-out) both;animation-delay:calc(var(--i,0) * 60ms);}
#app.enter .card,#app.enter .list-item,#app.enter .group{animation:unfurl .52s var(--ease-out) both;animation-delay:calc(var(--i,0) * 60ms);transform-origin:top center;}
#app.enter .grid-chips,#app.enter .seat-grid,#app.enter .btn,#app.enter .menu-btn,#app.enter .say-block,#app.enter .info-strip,#app.enter .steplink,#app.enter .linkbtn{animation:rise .4s var(--ease-out) both;animation-delay:calc(var(--i,0) * 60ms);}
#app.enter .card .grid-chips,#app.enter .card .seat-grid,#app.enter .card .btn,#app.enter .card .say-block,#app.enter .card .info-strip,#app.enter .card .steplink,#app.enter .card .linkbtn,#app.enter .card .list-item,#app.enter .card .phase-banner,#app.enter .card .role-hero,#app.enter .group .list-item{animation:none;}

/* ---------- Phase veil (night <-> day transition) ---------- */
#veil{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;pointer-events:none;}
#veil.show{display:flex;animation:veil 1.35s ease-in-out both;}
#veil.night{background:radial-gradient(ellipse at 50% 30%, #3A1220 0%, #120A12 55%, #07060C 100%);}
#veil.day{background:radial-gradient(ellipse at 50% 30%, #6B4716 0%, #241018 60%, #07060C 100%);}
#veil .orb{width:88px;height:88px;border-radius:50%;animation:orbIn 1.35s var(--ease-out) both;}
#veil.night .orb{background:var(--moon-img) center/contain no-repeat;box-shadow:0 0 90px rgba(194,42,49,.6);}
#veil.day .orb{background:radial-gradient(circle, #FFF2C8 0%, #F2C14E 60%, rgba(242,193,78,0) 72%);box-shadow:0 0 90px rgba(242,193,78,.55);}
#veil .txt{font-family:var(--font-display);font-size:44px;letter-spacing:8px;color:var(--gold-2);text-shadow:0 0 30px rgba(194,42,49,.65), 0 2px 0 rgba(0,0,0,.4);animation:orbIn 1.6s var(--ease-out) .05s both;}
#veil .sub{font-family:var(--font-ui);font-size:13px;letter-spacing:4px;color:var(--text-2);animation:orbIn 1.6s var(--ease-out) .1s both;}
@keyframes veil{0%{opacity:0;}18%{opacity:1;}72%{opacity:1;}100%{opacity:0;}}
@keyframes orbIn{0%{opacity:0;transform:translateY(16px) scale(.85);}25%{opacity:1;transform:none;}75%{opacity:1;transform:none;}100%{opacity:0;transform:translateY(-10px);}}

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
  #sky .field{animation:none;}
  #veil.show{display:none;}
}

#daytint{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;background:linear-gradient(180deg, rgba(242,154,74,.15) 0%, rgba(96,32,18,.08) 55%, transparent 90%);transition:opacity 1.2s ease;}
body[data-phase="day"] #daytint{opacity:1;}
#sky{z-index:1;}
#sky .moon{display:none;}

/* ---------- Game menu buttons (hall medallions) ---------- */
.menu-btn{display:flex;align-items:center;gap:15px;width:100%;padding:16px 18px;border-radius:14px;min-height:80px;cursor:pointer;position:relative;overflow:hidden;
  border:1px solid rgba(194,42,49,.8);color:#F2DEC0;
  box-shadow:0 16px 36px rgba(0,0,0,.55), 0 0 24px rgba(194,42,49,.3), inset 0 1px 0 rgba(255,255,255,.1);
  transition:transform .15s var(--ease-out), box-shadow .25s, filter .25s;}
.menu-btn:active{transform:scale(.97);box-shadow:0 8px 20px rgba(0,0,0,.5), 0 0 12px rgba(194,42,49,.25), inset 0 1px 0 rgba(255,255,255,.08);}
.menu-btn.wolf{background:var(--noise), linear-gradient(135deg, rgba(82,18,24,.96), rgba(38,8,12,.98));}
.menu-btn.cards{background:var(--noise), linear-gradient(135deg, rgba(24,21,30,.97), rgba(11,9,15,.98));}
.menu-btn::after{content:'';position:absolute;top:-60%;bottom:-60%;left:-35%;width:20%;background:linear-gradient(105deg, transparent, rgba(242,222,192,.12) 50%, transparent);transform:skewX(-18deg);animation:shimmer 4.5s ease-in-out 2s infinite;pointer-events:none;}
.menu-btn .medal{width:58px;height:58px;flex:none;border-radius:50%;position:relative;background:radial-gradient(circle at 34% 30%, #6E141C, #2A0A12 72%);border:1.5px solid rgba(242,222,192,.55);box-shadow:inset 0 0 0 3px rgba(0,0,0,.42), 0 0 16px rgba(194,42,49,.45);}
.menu-btn .medal::after{content:'';position:absolute;inset:6px;border-radius:50%;background:center/contain no-repeat;}
.menu-btn.wolf .medal::after{background-image:var(--emblem);filter:sepia(.5) hue-rotate(-24deg) saturate(2.6) brightness(1.3) drop-shadow(0 0 4px rgba(242,222,192,.35));}
.menu-btn.cards .medal::after{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><g><rect x='10' y='26' width='15' height='22' rx='3' fill='%23E8CBA0'/><rect x='24.5' y='23' width='15' height='22' rx='3' fill='%23D8B87E'/><rect x='39' y='26' width='15' height='22' rx='3' fill='%23E8CBA0'/></g><circle cx='17.5' cy='33.5' r='4' fill='none' stroke='%23F2DEC0' stroke-width='1.5'/><circle cx='17.5' cy='33.5' r='1' fill='%23F2DEC0'/><circle cx='32' cy='33.5' r='3' fill='none' stroke='%23F2DEC0' stroke-width='1.4'/><g stroke='%23F2DEC0' stroke-width='1.2' stroke-linecap='round'><line x1='32' y1='27.5' x2='32' y2='29.2'/><line x1='32' y1='37.8' x2='32' y2='39.5'/><line x1='26.3' y1='33.5' x2='28' y2='33.5'/><line x1='36' y1='33.5' x2='37.7' y2='33.5'/><line x1='28' y1='29.5' x2='29.3' y2='30.8'/><line x1='34.7' y1='36.2' x2='36' y2='37.5'/><line x1='28' y1='37.5' x2='29.3' y2='36.2'/><line x1='34.7' y1='30.8' x2='36' y2='29.5'/></g><circle cx='46.5' cy='31.5' r='2.8' fill='%23F2DEC0'/><path d='M40.5 42.5 c0-3.4 2.7-5.6 6-5.6 s6 2.2 6 5.6' fill='%23F2DEC0'/></svg>");}
.menu-btn .ml{font-family:var(--font-display);font-size:22px;letter-spacing:3px;color:#F2DEC0;text-shadow:0 2px 0 rgba(0,0,0,.55), 0 0 18px rgba(194,42,49,.45);}

/* ---------- Empty-state wipe seal ---------- */
.glyph.wipe{width:44px;height:44px;margin:0 auto 12px;border-radius:14px;background:radial-gradient(circle at 34% 30%, #6E141C, #2A0A12 72%);border:1.5px solid rgba(242,222,192,.55);box-shadow:inset 0 0 0 3px rgba(0,0,0,.42), 0 0 16px rgba(194,42,49,.45);display:flex;align-items:center;justify-content:center;}
.glyph.wipe::before{content:'✕';color:#F2DEC0;font-size:22px;font-family:var(--font-serif);}


/* ---------- Grouped inset lists (native idiom: inset grouped list) ---------- */
.group{background:var(--noise), linear-gradient(160deg,#EEDDB6,var(--parch-2));border-radius:var(--radius);overflow:hidden;margin-bottom:16px;box-shadow:0 16px 32px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.3);}
.group .list-item{
  --fg:var(--ink);--fg-2:var(--ink-2);--fg-3:var(--ink-3);--separator:rgba(90,66,20,.24);--hair:rgba(90,66,20,.38);--hair-strong:rgba(90,66,20,.6);--fill:rgba(60,40,10,.07);--fill-strong:rgba(60,40,10,.13);
  --accent:var(--gold-3);--moon:var(--gold-3);--wolf:#A32830;--good:#2E5D49;--special:#7055A8;--wolf-soft:rgba(142,37,32,.14);--moon-soft:rgba(138,106,30,.18);--good-soft:rgba(36,70,58,.14);--special-soft:rgba(94,69,143,.14);
  --text-1:var(--fg);--text-2:var(--fg-2);--text-3:var(--fg-3);
  display:flex;align-items:center;gap:12px;min-height:52px;padding:11px 16px;margin:0;color:var(--fg);position:relative;cursor:pointer;background:transparent;border:none;border-radius:0;box-shadow:none;transition:background .15s ease;}
.group .list-item:active{background:rgba(60,40,10,.09);}
.group .list-item+.list-item::before{content:"";position:absolute;top:0;left:56px;right:0;height:1px;background:var(--separator);}
.group .list-item.selected{background:rgba(60,40,10,.10);}
.group .list-item.selected::after{content:"";width:7px;height:13px;border-right:2px solid var(--gold-3);border-bottom:2px solid var(--gold-3);transform:rotate(45deg);flex:none;margin-inline-start:auto;}
.group .chev{width:9px;height:9px;border-top:1.6px solid var(--ink-3);border-right:1.6px solid var(--ink-3);transform:rotate(45deg);flex:none;margin-inline-start:auto;opacity:.85;}
.group .list-item .li-main{flex:1;min-width:0;}

/* ---------- Switch (native toggle) ---------- */
.switch{width:51px;height:31px;border-radius:16px;background:rgba(242,222,192,.18);border:1px solid var(--hair);position:relative;flex:none;cursor:pointer;transition:background .2s var(--ease-out);}
.switch::after{content:"";position:absolute;top:1.5px;left:1.5px;width:26px;height:26px;border-radius:50%;background:#F7F2E6;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .2s var(--ease-out);}
.switch.on{background:linear-gradient(135deg,#C22A31,#7E141B);border-color:rgba(242,222,192,.7);}
.switch.on::after{transform:translateX(20px);}
.card .switch{background:rgba(60,40,10,.18);border-color:rgba(90,66,20,.5);}
.card .switch.on{background:linear-gradient(135deg,#C22A31,#7E141B);}

/* ---------- Sheet (native modal presentation) ---------- */
#sheetHost{position:fixed;inset:0;z-index:300;display:none;}
#sheetHost.show{display:block;}
#sheetHost .scrim{position:absolute;inset:0;background:rgba(4,3,6,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fadeIn .24s ease both;}
#sheetHost .sheet-wrap{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);display:flex;flex-direction:column;gap:8px;}
#sheetHost .sheet-head{padding:0 18px 10px;text-align:center;animation:fadeIn .3s ease both;}
#sheetHost .sheet-title{font-family:var(--font-ui);font-size:var(--ts-subhead);font-weight:600;color:#F7EFE0;text-shadow:0 1px 3px rgba(0,0,0,.6);}
#sheetHost .sheet-msg{margin-top:5px;font-size:var(--ts-footnote);color:rgba(247,239,224,.82);line-height:1.45;text-shadow:0 1px 3px rgba(0,0,0,.6);}
#sheetHost .sheet-actions{border-radius:14px;overflow:hidden;background:var(--noise),linear-gradient(160deg,#EEDDB6,var(--parch-2));box-shadow:0 18px 44px rgba(0,0,0,.55);animation:sheetIn .34s var(--ease-out) both;}
#sheetHost .sheet-actions.cancel{animation-delay:.04s;}
#sheetHost .sheet-actions.cancel .sheet-btn{font-weight:600;color:var(--gold-3);}
#sheetHost .sheet-btn{display:block;width:100%;min-height:56px;padding:14px 18px;background:transparent;border:none;border-bottom:1px solid rgba(90,66,20,.22);
  font-family:var(--font-ui);font-size:var(--ts-headline);font-weight:500;color:var(--gold-3);cursor:pointer;transition:background .15s ease;}
#sheetHost .sheet-btn:last-child{border-bottom:none;}
#sheetHost .sheet-btn:active{background:rgba(60,40,10,.1);}
#sheetHost .sheet-btn.danger{color:#8E161D;font-weight:600;}
@keyframes sheetIn{from{transform:translateY(26px);opacity:0;}to{transform:none;opacity:1;}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

/* ---------- Themed inline glyphs (replace functional emoji) ---------- */
.ico{width:1em;height:1em;display:inline-block;vertical-align:-.12em;}
.phase-banner .icon .ico{width:30px;height:30px;color:var(--gold-2);filter:drop-shadow(0 0 10px rgba(242,222,192,.5));}
.seat-tile .crown .ico{width:12px;height:12px;color:var(--gold-2);}

/* ---------- Focus (keyboard / iPadOS pointer) ---------- */
:focus-visible{outline:2px solid var(--tint-text);outline-offset:2px;}

/* ---------- Increased contrast (night-only app; this is our adaptivity) ---------- */
@media (prefers-contrast: more){
  :root{--fg:#FFFFFF;--fg-2:#E9E2D4;--fg-3:#C4BAA6;--label-1:#FFFFFF;--label-2:#E9E2D4;--label-3:#C4BAA6;
    --separator:rgba(255,255,255,.28);--separator-strong:rgba(255,255,255,.5);
    --hair:rgba(255,255,255,.42);--hair-strong:rgba(255,255,255,.85);
    --fill:rgba(255,255,255,.1);--fill-strong:rgba(255,255,255,.18);
    --tint-text:#FF7278;--accent:#E5484F;--surface-1:rgba(6,4,7,.94);}
  .group .list-item{--fg:#000;--fg-2:#241A0E;--fg-3:#3D3120;--separator:rgba(40,25,5,.5);}
  .menu-btn,.btn-primary,.chip.active,.seat-tile.selected{border-width:2px;}
}


/* ---------- Grouped form rows (native form idiom) ---------- */
.group.form{--fg:var(--ink);--fg-2:var(--ink-2);--fg-3:var(--ink-3);--separator:rgba(90,66,20,.24);--hair:rgba(90,66,20,.38);--hair-strong:rgba(90,66,20,.6);}
.group.form .field-row{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 16px;position:relative;}
.group.form .field-row+.field-row::before{content:"";position:absolute;top:0;left:56px;right:0;height:1px;background:rgba(90,66,20,.24);}
.group.form .field-row label{width:52px;flex:none;font-size:var(--ts-subhead);font-weight:600;color:var(--ink);}
.group.form .field-row input[type=text]{flex:1;background:rgba(255,250,235,.55);border-color:rgba(90,66,20,.35);font-size:var(--ts-subhead);color:var(--ink);-webkit-text-fill-color:var(--ink);}
.group.form .field-row input[type=text]::placeholder{color:#6A5A3E;opacity:1;}


/* ---------- Added advanced roles: one-line row, tap to reveal rules ---------- */
.stepper-row.ext-added{align-items:center;gap:8px;}
.ext-main{flex:1;min-width:0;cursor:pointer;padding:10px 0;border-radius:8px;}
.ext-main:active{background:rgba(60,40,10,.06);}
.ext-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.ext-chev{width:9px;height:9px;border-right:1.6px solid var(--fg-3);border-bottom:1.6px solid var(--fg-3);transform:rotate(45deg);transition:transform .2s var(--ease-out);flex:none;margin-right:4px;}
.ext-chev.open{transform:rotate(-135deg);}
.ext-desc{margin-top:6px;font-size:var(--ts-footnote);color:var(--fg-2);line-height:1.6;}


/* ---------- Row tap area (keeps inner rows from swallowing sibling buttons) ---------- */
.row-tap{flex:1;min-width:0;display:flex;align-items:center;gap:12px;cursor:pointer;padding:2px 0;border-radius:8px;}
.row-tap:active{background:rgba(60,40,10,.06);}
.group .list-item.danger .li-title{color:#8E161D;font-weight:600;}
.toast.with-action{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 18px;}
.toast-action{min-height:var(--tap);padding:0 12px;border:none;background:transparent;color:var(--gold-3);font-family:var(--font-ui);font-weight:700;font-size:var(--ts-subhead);cursor:pointer;}
.toast-action:active{opacity:.6;}


/* ---------- Draw + speech timer ---------- */
.draw-box{text-align:center;padding:6px 0 14px;}
.draw-num{font-family:var(--font-display);font-size:76px;line-height:1.05;color:var(--accent-2);}
.draw-num.pop{animation:popNum .5s var(--ease-out) both;}
@keyframes popNum{0%{opacity:0;transform:scale(.55);}60%{opacity:1;transform:scale(1.08);}100%{opacity:1;transform:none;}}
.draw-sub{font-size:var(--ts-footnote);color:var(--fg-2);margin-top:6px;}
.order-list{margin-top:12px;border-top:1px solid var(--separator);}
.order-row{display:flex;gap:10px;align-items:center;min-height:42px;border-bottom:1px solid var(--separator);}
.order-idx{width:26px;height:26px;border-radius:50%;background:var(--fill-strong);color:var(--fg);display:flex;align-items:center;justify-content:center;font-size:var(--ts-caption);flex:none;}
.order-who{font-size:var(--ts-subhead);}
.tm-box{text-align:center;padding:10px 0 4px;}
.tm-clock{font-family:var(--font-display);font-size:58px;line-height:1.1;color:var(--accent-2);}
.tm-track{height:6px;border-radius:3px;background:var(--fill-strong);overflow:hidden;margin:10px 0 8px;}
.tm-fill{height:100%;background:linear-gradient(90deg,#C22A31,#E86A6E);transition:width .25s linear;}
.tm-state{font-size:var(--ts-footnote);color:var(--fg-2);}
.tm-who{margin:12px 0;text-align:center;font-size:var(--ts-subhead);font-weight:600;}
.tm-strip{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:0 0 10px;border:1px solid var(--hair-strong);border-radius:var(--radius-sm);background:var(--fill);}
.tm-strip-clock{font-family:var(--font-ui);font-weight:700;font-size:var(--ts-headline);color:var(--accent-2);min-width:58px;}
.tm-strip-who{flex:1;min-width:0;font-size:var(--ts-footnote);color:var(--label-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tm-strip-actions{display:flex;gap:6px;flex:none;}

/* ---- 响应式：更宽的窗口 / Chrome 横向拉伸 ---- */
@media (min-width:640px){
  #app{max-width:600px;}
  .seat-grid{grid-template-columns:repeat(6,1fr);}
  #sky .moon{right:4%;width:200px;height:200px;}
}
@media (min-width:900px){
  #app{max-width:760px;}
  .seat-grid{grid-template-columns:repeat(8,1fr);}
  .hero{padding:60px 32px 16px;}
  .hero h1{font-size:54px;}
  .hero::before{width:96px;height:96px;right:28px;top:22px;}
  .card{padding:24px 22px;}
}
@media (min-width:1200px){
  #app{max-width:880px;}
}

/* ---- 响应式：手机横屏 / 低高度窗口 ---- */
@media (orientation:landscape) and (max-height:520px){
  #app{max-width:900px;}
  .topbar{padding:calc(env(safe-area-inset-top) + 8px) 20px 8px;}
  .topbar h1{font-size:20px;}
  .hero{padding:14px 24px 4px;}
  .hero h1{font-size:30px;margin-bottom:4px;}
  .hero p{font-size:13px;}
  .hero::before{width:64px;height:64px;top:4px;right:14px;}
  .section{padding:10px 20px;}
  .card{padding:14px;margin-bottom:10px;}
  .role-hero{padding:4px 0 10px;}
  .role-hero .rb{width:44px;height:44px;font-size:18px;margin-bottom:8px;}
  .role-hero h2{font-size:22px;}
  .role-hero::before{width:130px;height:130px;}
  .phase-banner{padding:10px 14px;margin-bottom:10px;}
  .phase-banner .t1{font-size:20px;}
  .seat-grid{grid-template-columns:repeat(6,1fr);gap:7px;}
  .seat-tile{aspect-ratio:auto;padding:10px 4px 9px;gap:3px;}
  .seat-tile .num{font-size:19px;}
  .btn{padding:11px 16px;font-size:18px;}
  #sky .moon{width:120px;height:120px;top:calc(env(safe-area-inset-top) + 96px);right:-10px;opacity:.7;}
  #veil .txt{font-size:32px;}
}
@media (orientation:landscape) and (min-width:700px) and (max-height:520px){
  .seat-grid{grid-template-columns:repeat(8,1fr);}
}

</style>
</head>
<body>
<div id="scene"></div>
<div id="daytint"></div>
<div id="app"></div>
<div id="sheetHost"></div>
<input type="file" id="importFile" accept=".json,application/json" style="display:none" aria-hidden="true">
<div id="toastHost"></div>
<script>
/* ============ 数据备份与恢复 ============ */
function backupPayload(){
  return {app:'说书人 · 月夜密令', version:DB_VERSION,
    exportedAt:new Date().toISOString().slice(0,19).replace('T',' '),
    db:{roster:DB.roster, history:DB.history, current:DB.current, customPresets:DB.customPresets}};
}
function backupText(){ return JSON.stringify(backupPayload(),null,2); }
function backupSummary(p){
  const d=(p&&p.db)||{};
  return {games:(d.history||[]).length, players:(d.roster||[]).length, presets:(d.customPresets||[]).length,
    when:(p&&p.exportedAt)||'未知时间', version:Number(p&&p.version)||1, hasCurrent:!!d.current};
}
function exportBackup(){
  const sum=backupSummary(backupPayload());
  openSheet({title:'导出备份', message:'包含 '+sum.games+' 局历史、'+sum.players+' 名玩家、'+sum.presets+' 个自定义配置。',
    actions:[{label:'保存为文件', onPick:downloadBackup},{label:'复制备份文本', onPick:openTextBackup},{label:'取消'}]});
}
function downloadBackup(){
  try{
    const blob=new Blob([backupText()],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='说书人备份_'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },5000);
    toast('备份文件已生成');
  }catch(e){ toast('这个浏览器不能直接存文件，请改用“复制备份文本”'); }
}
function openTextBackup(){
  const host=document.getElementById('sheetHost'); const txt=backupText();
  host.innerHTML='<div class="scrim" data-sheet-close></div><div class="sheet-wrap" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">'+
    '<div class="sheet-head"><div class="sheet-title" id="sheetTitle">复制备份文本</div><div class="sheet-msg">长按全选复制，存到备忘录或聊天里。</div></div>'+
    '<div class="sheet-actions" style="padding:12px;"><textarea id="backupTextArea" readonly aria-label="备份文本" style="min-height:140px;font-size:12px;">'+txt.replace(/</g,'&lt;')+'</textarea></div>'+
    '<div class="sheet-actions"><button class="sheet-btn" id="copyBackup">复制到剪贴板</button></div>'+
    '<div class="sheet-actions cancel"><button class="sheet-btn cancel" data-sheet-close>完成</button></div></div>';
  host.classList.add('show');
  host.querySelectorAll('[data-sheet-close]').forEach(function(el){ el.onclick=closeSheet; });
  const ta=document.getElementById('backupTextArea');
  document.getElementById('copyBackup').onclick=function(){
    const ok=function(){ toast('已复制到剪贴板'); };
    ta.select();
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok).catch(function(){ try{document.execCommand('copy');ok();}catch(e){toast('请长按选中后手动复制');} }); }
    else { try{document.execCommand('copy');ok();}catch(e){toast('请长按选中后手动复制');} }
  };
}
function importBackup(){
  openSheet({title:'导入备份', message:'读取备份里的历史记录、玩家名单和自定义配置。',
    actions:[{label:'从文件导入', onPick:function(){ const f=document.getElementById('importFile'); if(f) f.click(); }},
             {label:'粘贴备份文本', onPick:openPasteBackup},{label:'取消'}]});
}
function openPasteBackup(){
  const host=document.getElementById('sheetHost');
  host.innerHTML='<div class="scrim" data-sheet-close></div><div class="sheet-wrap" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">'+
    '<div class="sheet-head"><div class="sheet-title" id="sheetTitle">粘贴备份文本</div><div class="sheet-msg">把之前复制的备份内容粘进来。</div></div>'+
    '<div class="sheet-actions" style="padding:12px;"><textarea id="importTextArea" aria-label="备份文本" placeholder="在此粘贴备份内容" style="min-height:140px;font-size:12px;"></textarea></div>'+
    '<div class="sheet-actions"><button class="sheet-btn" id="doImportText">读取这份备份</button></div>'+
    '<div class="sheet-actions cancel"><button class="sheet-btn cancel" data-sheet-close>取消</button></div></div>';
  host.classList.add('show');
  host.querySelectorAll('[data-sheet-close]').forEach(function(el){ el.onclick=closeSheet; });
  document.getElementById('doImportText').onclick=function(){ handleImportPayload(document.getElementById('importTextArea').value); };
}
function handleImportPayload(raw){
  let parsed=null;
  try{ parsed=JSON.parse(raw); }catch(e){ toast('这段内容不是有效的备份'); return; }
  if(!parsed||!parsed.db){ toast('这份内容里没有找到备份数据'); return; }
  const sum=backupSummary(parsed);
  closeSheet();
  setTimeout(function(){
    openSheet({title:'导入这份备份？',

function applyImport(payload, replace){
  const inc=migrateDB({version:payload.version, roster:payload.db.roster, history:payload.db.history, current:payload.db.current, customPresets:payload.db.customPresets});
  if(replace){
    DB.roster=inc.roster; DB.history=inc.history; DB.customPresets=inc.customPresets; DB.current=inc.current;
  }else{
    inc.roster.forEach(function(q){ if(!DB.roster.some(function(x){return x.name===q.name;})) DB.roster.push(q); });
    inc.customPresets.forEach(function(q){ if(!DB.customPresets.some(function(x){return x.name===q.name;})) DB.customPresets.push(q); });
    inc.history.forEach(function(q){ if(!DB.history.some(function(x){return x.id===q.id;})) DB.history.push(q); });

let drawState={drawn:[], noRepeat:true, last:null, just:false, orderList:null, max:null};
let timer={dur:180,left:180,running:false,order:[],idx:0,int:null,done:false};
let audioCtx=null;
function fmtClock(v){ const t=Math.ceil(Math.max(0,v)); return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }
function toolsRange(){ const g=DB.current; const n=(g&&g.playerCount)||(setupState&&setupState.count)||12; return Math.max(2,Math.min(30,Number(drawState.max)||n)); }
function aliveOrder(){ const g=DB.current; if(g&&g.phase!=='ended'&&Array.isArray(g.seats)) return aliveSeats(g).map(function(x){return {seat:x.seat,name:x.name};}); return []; }
function ensureTimerOrder(){
  const live=aliveOrder();
  const changed=live.length&&timer.order.length!==live.length;
  if(!timer.order.length||changed){
    const cur=timer.order[timer.idx];
    if(live.length) timer.order=live;
    if(cur){
      const at=timer.order.findIndex(function(x){return x.seat===cur.seat;});
      timer.idx=at>=0?at:0;   /* stay with the same speaker while they live, otherwise start over */
    }
    if(timer.idx>=timer.order.length) timer.idx=0;
    timerPaint();
  }
  return timer.order;
}
function drawOne(){
  const max=toolsRange(); drawState.max=max;
  const pool=[];
  for(let i=1;i<=max;i++){ if(!drawState.noRepeat||drawState.drawn.indexOf(i)<0) pool.push(i); }
  if(!pool.length){ toast('1–'+max+' 已经抽完，点“重置”重新开始'); return; }
  const n=pool[Math.floor(Math.random()*pool.length)];
  drawState.last=n; drawState.just=true;
  if(drawState.noRepeat&&drawState.drawn.indexOf(n)<0) drawState.drawn.push(n);
  render();
  try{ if(navigator.vibrate) navigator.vibrate(35); }catch(e){}
}
function drawShuffleOrder(){
  const live=aliveOrder();
  const list=live.length?live.slice():Array.from({length:toolsRange()},function(_,i){return {seat:i+1,name:'未记录'};});
  for(let i=list.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=list[i]; list[i]=list[j]; list[j]=t; }
  drawState.orderList=list; render(); toast('已生成首轮发言顺序');
}
function unlockAudio(){ try{ if(!audioCtx){ const C=window.AudioContext||window.webkitAudioContext; if(C) audioCtx=new C(); } if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume(); }catch(e){} }
function beep(){ try{ if(!audioCtx) return; const o=audioCtx.createOscillator(), gn=audioCtx.createGain(); o.type='sine'; o.frequency.value=880; gn.gain.value=0.18; o.connect(gn); gn.connect(audioCtx.destination); o.start(); setTimeout(function(){ try{o.stop();}catch(e){} },450); }catch(e){} }
function timerPaint(){
  const c=document.getElementById('tmClock'); if(c) c.textContent=fmtClock(timer.left);
  const bar=document.getElementById('tmBar'); if(bar) bar.style.width=(timer.dur?(Math.max(0,timer.left)/timer.dur*100):0)+'%';
  const st=document.getElementById('tmState'); if(st) st.textContent=timer.running?'计时中':(timer.left<=0?'时间到':(timer.left<timer.dur?'已暂停':'待开始'));
}
function timerStart(){
  if(timer.running) return;
  ensureTimerOrder(); if(timer.left<=0) timer.left=timer.dur;
  unlockAudio(); timer.running=true; timer.done=false;
  clearInterval(timer.int); timer.int=setInterval(timerTick,250);
  timerPaint();
}
function timerPause(){ timer.running=false; clearInterval(timer.int); timer.int=null; timerPaint(); }
function timerReset(){ timerPause(); timer.left=timer.dur; timer.done=false; timerPaint(); }
function timerTick(){
  if(!timer.running) return;
  timer.left=Math.max(0,timer.left-0.25);
  if(timer.left<=0){ timer.running=false; clearInterval(timer.int); timer.int=null; timer.done=true;
    try{ if(navigator.vibrate) navigator.vibrate([200,120,200]); }catch(e){}
    beep(); toast('时间到 · 请下一位发言'); }
  timerPaint();
}
function timerNext(){
  const order=ensureTimerOrder();
  if(!order.length){ toast('还没有可切换的存活玩家'); return; }
  timer.idx=(timer.idx+1)%order.length; timer.left=timer.dur; timer.done=false;
  render(); timerPaint();
}

  drawState.just=false;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function nowStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function toast(msg, actionLabel, onAction){
  const host=document.getElementById('toastHost');
  const el=document.createElement('div'); el.className='toast'+(actionLabel?' with-action':'');
  const txt=document.createElement('span'); txt.textContent=msg; el.appendChild(txt);
  if(actionLabel){
    const b=document.createElement('button'); b.className='toast-action'; b.textContent=actionLabel;
    b.onclick=function(){ if(onAction) onAction(); el.remove(); };
    el.appendChild(b);
  }
  el.setAttribute('role','status'); el.setAttribute('aria-live','polite');
  host.appendChild(el);
  setTimeout(function(){ el.remove(); }, actionLabel?6500:2100);
}
function campOf(role){return (ROLE_META[role]||{camp:'villager'}).camp;}
function isFeared(g, seat){ return !!(seat && g.nightPending && g.nightPending.nightmareTarget===seat); }
function roleColorVar(role){const c=campOf(role);return c==='wolf'?'var(--wolf)':c==='god'?'var(--moon)':c==='special'?'var(--special)':'var(--text-3)';}
function seerDisplay(g, role){
  if(role==='雪狼' || role==='隐狼') return '好人';
  if(role==='狼弟'){
    const bro=g.seats.find(s=>s.role==='狼兄');
    return (bro && bro.alive) ? '好人' : '狼人';
  }
  return campOf(role)==='wolf' ? '狼人':'好人';
}
function campSummary(rc){
  let wolf=0, god=0, vil=0, special=0;
  Object.entries(rc||{}).forEach(([r,c])=>{
    if(!c || c<=0) return;
    const camp=campOf(r);
    if(camp==='wolf') wolf+=c; else if(camp==='god') god+=c; else if(camp==='villager') vil+=c; else special+=c;
  });
  return {wolf, god, vil, special, total: wolf+god+vil+special};
}

/* ============ 存储 ============ */
const STORE_KEY='ww_host_db_v1';
const DB_VERSION=2;
let dbWasMigrated=false;
function blankDB(){return {version:DB_VERSION, roster:[], history:[], current:null, customPresets:[]};}
/* Every save carries a version. Opening an older file upgrades it field by field, so
   records written by a previous version keep working instead of breaking the views. */
function migrateDB(raw){
  const db=(raw&&typeof raw==='object')?raw:{};
  const from=Number(db.version)||(raw?1:DB_VERSION);
  if(!Array.isArray(db.roster)) db.roster=[];
  if(!Array.isArray(db.history)) db.history=[];
  if(!Array.isArray(db.customPresets)) db.customPresets=[];
  if(!('current' in db)) db.current=null;
  db.roster=db.roster.filter(Boolean).map(function(p){
    return {id:(p&&p.id)?String(p.id):uid(), name:String((p&&p.name)||'').slice(0,24)};
  }).filter(function(p){return p.name;});
  db.customPresets=db.customPresets.filter(function(p){return p&&p.name&&p.roles&&typeof p.roles==='object';}).map(function(p){
    let n=0; Object.keys(p.roles).forEach(function(k){ n+=Number(p.roles[k])||0; });
    p.count=Number(p.count)||n; p.name=String(p.name).slice(0,40);
    return p;
  });
  db.history=db.history.filter(function(h){return h&&h.id&&Array.isArray(h.seats);}).map(function(h){
    h.nightLog=Array.isArray(h.nightLog)?h.nightLog:[];
    h.seats=h.seats.map(function(x){
      x.seat=Number(x.seat)||0; x.name=String(x.name||''); x.role=String(x.role||'');
      x.alive=(x.alive===undefined)?true:!!x.alive;
      return x;
    });
    if(!h.winner) h.winner='未判定';
    h.playerCount=Number(h.playerCount)||h.seats.length;
    h.nights=Number(h.nights)||h.nightLog.length;
    h.boardName=String(h.boardName||'未命名配置');
    return h;
  });
  if(db.current && (!Array.isArray(db.current.seats)||!db.current.seats.length)) db.current=null;
  if(db.current){
    db.current.nightLog=Array.isArray(db.current.nightLog)?db.current.nightLog:[];
    db.current.seats=db.current.seats.map(function(x){ x.role=String(x.role||''); return x; });
    if(!db.current.phase) db.current.phase='night';
    if(!db.current.nightPending||typeof db.current.nightPending!=='object') db.current.nightPending={};
    if(typeof db.current.nightStepIndex!=='number') db.current.nightStepIndex=0;
    if(!db.current.dayPending||typeof db.current.dayPending!=='object') db.current.dayPending={};
    if(!Array.isArray(db.current.dayPending.deathsToAnnounce)) db.current.dayPending.deathsToAnnounce=[];
    if(!('specialAction' in db.current.dayPending)) db.current.dayPending.specialAction=null;
    if(!db.current.dayStage) db.current.dayStage='sheriff';
    if(!Array.isArray(db.current.deathOrder)) db.current.deathOrder=[];
    /* day/night state a half-finished game is expected to carry */
    if(!Array.isArray(db.current.nightSteps)) db.current.nightSteps=[];
    if(!Array.isArray(db.current.dayPending.sheriffCandidates)) db.current.dayPending.sheriffCandidates=[];
    if(!('sheriffWinner' in db.current.dayPending)) db.current.dayPending.sheriffWinner=null;
    if(!Array.isArray(db.current.dayPending.votes)) db.current.dayPending.votes=[];
    if(!('pkCandidates' in db.current.dayPending)) db.current.dayPending.pkCandidates=null;
    ['wolf','witch','seer','guard','medium','dreamweaver','elder','cupid','heiwang','charm','nightmare','scapegoat','demonhunter','gargoyle','angel','moonApostle','wolfBeauty'].forEach(function(k){
      if(!db.current[k]||typeof db.current[k]!=='object') db.current[k]={};
    });
    /* a night in progress with no step list would show an empty screen: rebuild it from the roles in play */
    if(db.current.phase==='night'&&!db.current.nightSteps.length){
      db.current.nightSteps=buildNormalNightSteps(db.current);
      db.current.nightStepIndex=0;
    }
  }
  db.version=DB_VERSION;
  dbWasMigrated=(raw && from<DB_VERSION);
  return db;
}
function loadDB(){
  let raw=null;
  try{const t=localStorage.getItem(STORE_KEY); if(t) raw=JSON.parse(t);}catch(e){}
  /* safety copy of the previous payload, kept before any upgrade rewrites it */
  try{ if(raw) localStorage.setItem(STORE_KEY+'_bak', JSON.stringify(raw)); }catch(e){}
  return migrateDB(raw);
}

function addToRoster(name){
  name=(name||'').trim();
  if(!name) return null;
  let existing=DB.roster.find(p=>p.name===name);
  if(existing) return existing;
  const p={id:uid(), name};
  DB.roster.push(p); saveDB(); return p;
}

/* ============ 新游戏设置 ============ */
function startSetup(){
  setupState={step:1, count:null, boardName:null, roleCounts:null, seats:[], roleAssign:{}};
  go('setup');
}
function setupBack(){ if(setupState.step>1){ setupState.step-=1; render(); } }
function setupTotal(){ if(!setupState.roleCounts) return 0; return Object.values(setupState.roleCounts).reduce((a,b)=>a+b,0); }
function pickCount(n){ setupState.count=n; setupState.roleCounts=null; setupState.boardName=null; setupState.seats=[]; setupState.roleAssign={}; render(); }
function pickPreset(p){ setupState.boardName=p.name; setupState.roleCounts={...p.roles}; setupState.step=3; initSeats(); render(); }
function useCustomBoard(){
  const n=setupState.count;
  setupState.boardName='自定义配置';
  const wolves=Math.max(1, Math.round(n/3));
  setupState.roleCounts={'预言家':1,'女巫':1,'猎人':0,'守卫':0,'白痴':0,'狼人':wolves,'平民':Math.max(0,n-1-1-wolves)};
  render();
}
function recomputeVillager(){
  const rc=setupState.roleCounts;
  const fixedTotal=Object.keys(rc).filter(r=>r!=='平民').reduce((a,r)=>a+rc[r],0);
  rc['平民']=Math.max(0,setupState.count-fixedTotal);
}
function adjustRole(role, delta){
  const rc=setupState.roleCounts;
  let v=(rc[role]||0)+delta;
  if(v<0) return;
  if(role!=='平民' && role!=='狼人' && v>1) return;
  rc[role]=v;
  recomputeVillager(); render();
}
function toggleExtendedRole(role){
  const rc=setupState.roleCounts;
  if(rc[role]) delete rc[role]; else rc[role]=1;
  recomputeVillager(); render();
}
function initSeats(){ const n=setupState.count; setupState.seats=[]; for(let i=1;i<=n;i++) setupState.seats.push({seat:i, name:''}); }
function confirmBoardStep(){
  if(setupTotal()!==setupState.count){toast('角色总数需等于玩家人数 '+setupState.count);return;}
  setupState.step=3; if(!setupState.seats.length) initSeats(); render();
}
function saveCustomPreset(){
  if(!setupState.roleCounts || setupTotal()!==setupState.count){toast('请先把角色配置完整');return;}
  const name=prompt('给这个配置起个名字：', setupState.boardName==='自定义配置'?'':setupState.boardName);
  if(!name || !name.trim()) return;
  DB.customPresets.push({id:uid(), name:name.trim(), count:setupState.count, roles:{...setupState.roleCounts}});
  saveDB(); toast('已保存为常用配置'); render();
}
function deleteCustomPreset(id){ DB.customPresets=DB.customPresets.filter(p=>p.id!==id); saveDB(); render(); }
function setSeatName(seat, name){ const s=setupState.seats.find(s=>s.seat===seat); s.name=name; }
function confirmSeatsStep(){
  const empty=setupState.seats.some(s=>!s.name.trim());
  if(empty){toast('请填写每个座位的玩家姓名');return;}
  setupState.seats.forEach(s=>addToRoster(s.name.trim()));
  setupState.step=4; setupState.roleAssign=setupState.roleAssign||{}; render();
}
function randomAssignRoles(){
  const pool=[];
  Object.entries(setupState.roleCounts).forEach(([role,c])=>{for(let i=0;i<c;i++)pool.push(role);});
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  const assign={};
  setupState.seats.forEach((s,idx)=>{assign[s.seat]=pool[idx];});
  setupState.roleAssign=assign; render();
}
function manualSetRole(seat, role){ setupState.roleAssign[seat]=role; }
function remainingRoleCounts(){
  const rc={...setupState.roleCounts};
  Object.values(setupState.roleAssign||{}).forEach(r=>{if(r) rc[r]--;});
  return rc;
}
function confirmRolesStep(){
  const assign=setupState.roleAssign||{};
  const allSet=setupState.seats.every(s=>assign[s.seat]);
  if(!allSet){toast('请为每个座位分配身份，或点击"随机分配"');return;}
  const rem=remainingRoleCounts();
  if(Object.values(rem).some(v=>v!==0)){toast('身份分配与配置不一致');return;}
  launchGame();
}
function launchGame(){
  const seats=setupState.seats.map(s=>({
    seat:s.seat, name:s.name.trim(), role:setupState.roleAssign[s.seat],
    alive:true, cause:null, deathDay:null, isSheriff:false, idiotRevealed:false, canVote:true
  }));
  startGameWithSeats(seats, false);
}

  const seats=setupState.seats.map(s=>({
    seat:s.seat, name:s.name.trim(), role:null,
    alive:true, cause:null, deathDay:null, isSheriff:false, idiotRevealed:false, canVote:true
  }));
  startGameWithSeats(seats, true);
}
function startGameWithSeats(seats, identifyMode){
  const game={
    id:uid(), createdAt:nowStr(),
    playerCount:setupState.count, boardName:setupState.boardName, roleCounts:setupState.roleCounts,
    seats, identifyMode:!!identifyMode,
    guard:{lastProtected:null}, witch:{healUsed:false, poisonUsed:false}, wolf:{lastTarget:null}, nightmare:{lastTarget:null}, dreamweaver:{lastTarget:null},
    seerHistory:{}, gargoyleHistory:{}, elder:{lastMuted:null},
    couple:null, coupleThirdCamp:false, wolfBeauty:{charmedSeat:null},
    knightUsed:false, gravekeeperLastUsedDay:null, moonApostleSkipNextNight:false, moonApostleCannotPoint:false, moonApostleFinal:null,
    wolfBroDoubleKnifeNext:false, wolfBroDoubleKnifeTonight:false,
    night:0, day:0, phase:'night', showOverview:false,
    nightSteps:[], nightStepIndex:0,
    nightPending:{},

/* ============ 存活辅助 ============ */
function aliveSeats(g){return g.seats.filter(s=>s.alive);}
function seatBy(g,n){return g.seats.find(s=>s.seat===n);}
function livingOfRole(g, role){return g.seats.find(s=>s.alive && s.role===role);}

/* ============ 死亡与连锁（殉情） ============ */
function killSeat(g, seatNum, cause, dayNum){
  const s=seatBy(g,seatNum);
  if(!s || !s.alive) return [];
  s.alive=false; s.cause=cause; s.deathDay=dayNum;
  let cascade=[{seat:seatNum,cause}];
  if(s.role==='狼美人' && g.wolfBeauty && g.wolfBeauty.charmedSeat){
    const c=seatBy(g,g.wolfBeauty.charmedSeat);
    if(c && c.alive) cascade=cascade.concat(killSeat(g,c.seat,'殉情（狼美人）',dayNum));
  }
  if(g.couple && g.couple.includes(seatNum)){
    const other=g.couple.find(x=>x!==seatNum);
    const os=seatBy(g,other);
    if(os && os.alive) cascade=cascade.concat(killSeat(g,other,'殉情（情侣）',dayNum));
  }
  return cascade;
}
function checkWolfBroTrigger(g, cascade){
  if(cascade.some(c=>seatBy(g,c.seat) && seatBy(g,c.seat).role==='狼兄')) g.wolfBroDoubleKnifeNext=true;
}

/* ============ 夜晚流程 ============ */
function buildNormalNightSteps(g){
  const steps=[];
  const skip=g.moonApostleSkipNextNight;
  if(livingOfRole(g,'梦魇')) steps.push('nightmare');
  /* 入梦先定：后面所有夜间技能才知道谁被梦境阻挡 */
  if(livingOfRole(g,'摄梦人')) steps.push('dreamweaver');
  if(g.night===1){
    if(livingOfRole(g,'丘比特')) steps.push('cupid');
    if(livingOfRole(g,'黑狼王')) steps.push('heiwang');
  }
  if(livingOfRole(g,'狼美人')) steps.push('charm');
  if(!skip){
    if(livingOfRole(g,'守卫')) steps.push('guard');
    if(livingOfRole(g,'守护天使')) steps.push('angel');
    if(livingOfRole(g,'蛊惑师')) steps.push('scapegoat');
    const gg=livingOfRole(g,'石像鬼');
    if(gg){
      const otherWolves=g.seats.some(s=>s.alive && campOf(s.role)==='wolf' && s.seat!==gg.seat);
      if(otherWolves) steps.push('gargoyle');
    }
  }
  const soleWolfIsMoonApostleBlocked = g.moonApostleCannotPoint && aliveSeats(g).filter(s=>campOf(s.role)==='wolf').every(s=>s.role==='血月使徒');
  if(!soleWolfIsMoonApostleBlocked) steps.push('wolf');
  if(livingOfRole(g,'恶魔')) steps.push('demon');   /* 恶魔：与狼人一同睁眼之后，单独验神 */
  if(!skip){
    if(livingOfRole(g,'女巫')) steps.push('witch');
    if(livingOfRole(g,'预言家')) steps.push('seer');
    if(g.night>=2 && livingOfRole(g,'猎魔人')) steps.push('demonhunter');
    if(livingOfRole(g,'通灵师') && g.seats.some(s=>!s.alive)) steps.push('medium');
    if(livingOfRole(g,'禁言长老')) steps.push('elder');
  }
  steps.push('notes');
  return steps;
}
const WOLF_CAMP_ROLES=['狼人','狼王','白狼王','黑狼王','隐狼','狼美人','雪狼','血月使徒','石像鬼','恶灵骑士','狼兄','狼弟','梦魇','恶魔'];
function buildIdentifyNightSteps(g){
  const rc=g.roleCounts||{};
  const has=(r)=>(rc[r]||0)>0;
  const steps=[];
  if(has('丘比特')){ steps.push('identify:丘比特'); steps.push('cupid'); }
  if(WOLF_CAMP_ROLES.some(r=>has(r))) steps.push('identify:wolfgroup');
  if(has('梦魇')) steps.push('nightmare');
  if(has('黑狼王')) steps.push('heiwang');
  if(has('狼美人')) steps.push('charm');
  if(has('守卫')){ steps.push('identify:守卫'); steps.push('guard'); }
  if(has('守护天使')){ steps.push('identify:守护天使'); steps.push('angel'); }
  if(has('蛊惑师')){ steps.push('identify:蛊惑师'); steps.push('scapegoat'); }
  if(has('石像鬼')){
    const otherWolfCount=WOLF_CAMP_ROLES.filter(r=>r!=='石像鬼').reduce((a,r)=>a+(rc[r]||0),0);
    if(otherWolfCount>0) steps.push('gargoyle');
  }
  steps.push('wolf');
  if(has('女巫')){ steps.push('identify:女巫'); steps.push('witch'); }
  if(has('预言家')){ steps.push('identify:预言家'); steps.push('seer'); }
  if(has('猎魔人')) steps.push('identify:猎魔人');
  if(has('摄梦人')){ steps.push('identify:摄梦人'); steps.push('dreamweaver'); }
  if(has('恶魔')) steps.push('demon');
  if(has('禁言长老')){ steps.push('identify:禁言长老'); steps.push('elder'); }
  ['猎人','白痴','骑士','驯熊师','炸弹人','恶魔'].forEach(r=>{ if(has(r)) steps.push('identify:'+r); });
  if((rc['平民']||0)>0) steps.push('identify:villagers');
  steps.push('notes');
  return steps;
}
function beginNight(g){
  g.night+=1;
  const steps = (g.identifyMode && g.night===1) ? buildIdentifyNightSteps(g) : buildNormalNightSteps(g);
  g.nightSteps=steps; g.nightStepIndex=0;
  g.nightPending={
    guardTarget:undefined, angelTarget:undefined, wolfTarget:undefined, wolfTarget2:undefined, witchHeal:false, witchHealTarget:null, witchPoisonTarget:null,
    seerTarget:null, seerResult:null, seerConfirmed:false,

    mediumTarget:null, mediumResult:null, mediumConfirmed:false,

}
function currentNightStepKey(g){return g.nightSteps[g.nightStepIndex];}
function nightStepNext(g){

function nightStepBack(g){ if(g.nightStepIndex>0){ g.nightStepIndex-=1; render(); } }
function currentNightIcons(g){
  const p=g.nightPending; const map={};
  const add=(seat,ic)=>{ if(!seat) return; map[seat]=(map[seat]||'')+ic; };
  add(p.guardTarget,'🛡'); add(p.angelTarget,'😇'); add(p.wolfTarget,'🐺'); add(p.wolfTarget2,'🐺');
  if(p.witchHeal && p.witchHealTarget) add(p.witchHealTarget,'💊');
  add(p.witchPoisonTarget,'☠'); add(p.seerTarget,'🔮'); add(p.gargoyleTarget,'🗿');
  add(p.mediumTarget,'👻'); add(p.dreamTarget,'💤'); add(p.elderTarget,'🤐'); add(p.demonTarget,'👁');
  add(p.charmTarget,'💋'); add(p.heiwangTarget,'👁');
  add(p.scapegoatTarget,'🎯'); add(p.demonHunterTarget,'🗡'); add(p.nightmareTarget,'😱');
  if(p.cupidA) add(p.cupidA,'💘'); if(p.cupidB) add(p.cupidB,'💘');
  return map;
}
function bearRoarInfo(g){
  const bear=livingOfRole(g,'驯熊师');
  if(!bear) return null;
  const n=g.seats.length;
  const leftNum = bear.seat-1<1 ? n : bear.seat-1;
  const rightNum = bear.seat+1>n ? 1 : bear.seat+1;
  const neighbors=[seatBy(g,leftNum), seatBy(g,rightNum)].filter(s=>s && s.alive);
  return neighbors.some(s=>campOf(s.role)==='wolf' && s.role!=='隐狼');   /* 隐狼对驯熊师同样显示为好人 */
}
function settleNight(g){
  const p=g.nightPending;
  const guardSeat=(livingOfRole(g,'守卫')||{}).seat;
  const angelSeat=(livingOfRole(g,'守护天使')||{}).seat;
  const guardTarget = isFeared(g,guardSeat) ? null : p.guardTarget;
  const angelTarget = isFeared(g,angelSeat) ? null : p.angelTarget;
  const bearRoar=bearRoarInfo(g);
  const nightmareBlocksWolf = g.night===1 && p.nightmareTarget && campOf(seatBy(g,p.nightmareTarget).role)==='wolf';
  /* 摄梦人：本夜入梦者、是否连续两晚同一人、以及被梦境挡下的夜间攻击次数 */
  const dreamTarget=(p.dreamTarget===undefined?null:p.dreamTarget);
  const dreaming=(seat)=>dreamTarget!==null && seat!==null && seat!==undefined && seat===dreamTarget;
  const prevDream=(g.dreamweaver&&g.dreamweaver.lastTarget!==undefined)?g.dreamweaver.lastTarget:null;
  const dreamChain = dreamTarget!==null && prevDream!==null && prevDream===dreamTarget;
  let dreamImmune=0;
  const witchSeat=(livingOfRole(g,'女巫')||{}).seat;
  const witchFeared=isFeared(g,witchSeat);
  const witchHeal = witchFeared? false : p.witchHeal;
  const witchHealTarget = witchFeared? null : p.witchHealTarget;
  const witchPoisonTarget = witchFeared? null : p.witchPoisonTarget;
  const seerFeared=isFeared(g,(livingOfRole(g,'预言家')||{}).seat);
  const dcSeatThisNight=(livingOfRole(g,'摄梦人')||{}).seat;   /* 结算前先记住摄梦人是谁 */
  const demonSeatThisNight=(livingOfRole(g,'恶魔')||{}).seat;  /* 恶魔：夜间绝对免疫 */
  const demonImmune=(seat)=>demonSeatThisNight!==undefined && seat===demonSeatThisNight;
  let demonBlocked=0;
  const dhFeared=isFeared(g,(livingOfRole(g,'猎魔人')||{}).seat);
  let plannedDeaths=[];
  const wolfTargets = (nightmareBlocksWolf ? [] : [p.wolfTarget, p.wolfTarget2].filter(t=>t)).filter(t=>seatBy(g,t).role!=='恶灵骑士');
  wolfTargets.forEach(wt=>{
    if(demonImmune(wt)){ demonBlocked++; return; }   /* 恶魔夜间免疫，连自家狼刀也杀不死 */
    if(dreaming(wt)){ dreamImmune++; return; }   /* 入梦者免疫夜间伤害：这一刀被消耗但无效 */
    const protectedByGuard = guardTarget===wt;
    const protectedByAngel = angelTarget===wt;
    const healed = witchHeal===true && witchHealTarget===wt;
    if((protectedByGuard||protectedByAngel) && healed){ plannedDeaths.push({seat:wt, cause:'狼刀（同守同救仍死亡）'}); }
    else if(protectedByGuard || protectedByAngel || healed){ /* saved */ }
    else { plannedDeaths.push({seat:wt, cause:'狼刀'}); }
  });
  if(witchPoisonTarget){
    const pt=seatBy(g,witchPoisonTarget);
    if(demonImmune(witchPoisonTarget)){ demonBlocked++; }   /* 恶魔免疫毒药 */
    else if(dreaming(witchPoisonTarget)){ dreamImmune++; }   /* 毒药被消耗，但入梦者不受影响 */
    else if(pt.role!=='猎魔人' && pt.role!=='恶灵骑士'){ plannedDeaths.push({seat:witchPoisonTarget, cause:'女巫毒杀'}); }
  }
  if(p.seerTarget && !seerFeared){
    const t=seatBy(g,p.seerTarget);
    if(!dreaming(p.seerTarget) && t.role==='恶灵骑士'){
      const seer=livingOfRole(g,'预言家');
      if(seer && !(guardTarget===seer.seat || angelTarget===seer.seat)) plannedDeaths.push({seat:seer.seat, cause:'被恶灵骑士反伤'});
    }
  }
  if(witchPoisonTarget && !dreaming(witchPoisonTarget)){
    const t=seatBy(g,witchPoisonTarget);
    if(t.role==='恶灵骑士'){
      const witch=livingOfRole(g,'女巫');
      if(witch && !(guardTarget===witch.seat || angelTarget===witch.seat)) plannedDeaths.push({seat:witch.seat, cause:'被恶灵骑士反伤'});
    }
  }
  if(p.demonHunterTarget && !dhFeared){
    const dh=livingOfRole(g,'猎魔人');
    const t=seatBy(g,p.demonHunterTarget);
    if(demonImmune(p.demonHunterTarget)){ demonBlocked++; }   /* 恶魔免疫狩猎 */
    else if(dreaming(p.demonHunterTarget)){ dreamImmune++; }   /* 狩猎被梦境消耗，未生效 */
    else if(campOf(t.role)==='wolf'){ plannedDeaths.push({seat:t.seat, cause:'猎魔人狩猎击杀'}); }
    else if(dh){ plannedDeaths.push({seat:dh.seat, cause:'猎魔人狩猎落空'}); }
  }
  const scapegoatOwner=livingOfRole(g,'蛊惑师');
  if(scapegoatOwner && p.scapegoatTarget){
    const hitsHer=plannedDeaths.some(d=>d.seat===scapegoatOwner.seat);
    const stand=seatBy(g,p.scapegoatTarget);
    if(hitsHer && stand && stand.alive && stand.seat!==scapegoatOwner.seat){
      plannedDeaths=plannedDeaths.filter(d=>d.seat!==scapegoatOwner.seat);
      plannedDeaths.push({seat:stand.seat, cause:'替死（蛊惑师指定）'});
    }
  }
  /* 连续两晚指定同一人：第二夜结束时立即死亡（守/救都无效） */
  if(dreamChain && !demonImmune(dreamTarget)) plannedDeaths.push({seat:dreamTarget, cause:'连续两晚入梦致死'});
  let allDeaths=[]; const seen=new Set();
  plannedDeaths.forEach(d=>{
    if(seen.has(d.seat)) return;
    const casc=killSeat(g,d.seat,d.cause,g.night);
    casc.forEach(c=>{ if(!seen.has(c.seat)){ seen.add(c.seat); allDeaths.push(c);} });
  });
  /* 摄梦人夜间出局：当夜入梦者随之共死（连坐/殉情仍会继续结算） */
  let dreamLinked=false;
  if(dcSeatThisNight && dreamTarget!==null && dreamTarget!==dcSeatThisNight && !demonImmune(dreamTarget) && allDeaths.some(d=>d.seat===dcSeatThisNight)){
    const extra=killSeat(g,dreamTarget,'共死（摄梦人）',g.night);
    extra.forEach(c=>{ if(!seen.has(c.seat)){ seen.add(c.seat); allDeaths.push(c); } });
    dreamLinked=true;
  }
  g.dreamweaver=g.dreamweaver||{}; g.dreamweaver.lastTarget=dreamTarget;   /* 供下一夜判断是否连续入梦 */
  if(guardTarget!==undefined) g.guard.lastProtected=guardTarget||null;
  if(witchHeal) g.witch.healUsed=true;
  if(witchPoisonTarget) g.witch.poisonUsed=true;
  g.wolf.lastTarget=p.wolfTarget||null;
  g.wolf.lastTarget2=p.wolfTarget2||null;
  if(livingOfRole(g,'梦魇')) g.nightmare.lastTarget=p.nightmareTarget||null;
  if(g.nightSteps.includes('elder')) g.elder.lastMuted=p.elderTarget||null;
  if(g.night===1 && p.cupidA && p.cupidB){
    g.couple=[p.cupidA,p.cupidB];
    g.coupleThirdCamp = campOf(seatBy(g,p.cupidA).role)!==campOf(seatBy(g,p.cupidB).role);
  }
  if(p.charmTarget!==undefined){ g.wolfBeauty.charmedSeat=p.charmTarget||null; }
  let dreamDied=false;
  if(dreamTarget!==null){ dreamDied = allDeaths.some(d=>d.seat===dreamTarget); }
  g.nightLog.push({
    night:g.night, guardTarget:guardTarget||null, angelTarget:angelTarget||null, wolfTarget:p.wolfTarget||null, wolfTarget2:p.wolfTarget2||null,
    witchHeal:witchHeal, witchHealTarget:witchHealTarget||null, witchPoisonTarget:witchPoisonTarget, seerTarget:seerFeared?null:p.seerTarget, seerResult:seerFeared?null:p.seerResult,
    gargoyleTarget:p.gargoyleTarget||null, gargoyleResult:p.gargoyleResult||null,
    mediumTarget:p.mediumTarget||null, mediumResult:p.mediumResult||null,
    dreamTarget:dreamTarget, dreamDied, dreamImmune, dreamChain, dreamLinked,
    demonTarget:p.demonTarget||null, demonResult:p.demonResult||null, demonBlocked,
    elderTarget:p.elderTarget||null,
    cupid: (g.night===1 && g.couple) ? g.couple.slice() : null,
    heiwangTarget:p.heiwangTarget||null, heiwangResult:p.heiwangResult||null,
    charmTarget:p.charmTarget||null,
    scapegoatTarget:p.scapegoatTarget||null,
    demonHunterTarget:dhFeared?null:p.demonHunterTarget, demonHunterResult:dhFeared?null:p.demonHunterResult,
    nightmareTarget:p.nightmareTarget||null, nightmareBlockedWolf:nightmareBlocksWolf, bearRoar:bearRoar,
    notes:p.notes||'', deaths:allDeaths.map(d=>d.seat), deathCauses:allDeaths
  });
  beginDay(g, allDeaths);
}
function beginDay(g, nightDeaths){

  nightDeaths.forEach(d=>{ const s=seatBy(g,d.seat); if(s.role==='猎人' && d.cause.indexOf('狼刀')===0 && d.seat!==nmSeat){ hunterQueue.push(s.seat); } });

    sheriffCandidates:[], sheriffWinner:null, sheriffDone:false,

    hunterQueueDay:null, specialAction:null, gravekeeperTarget:null, gravekeeperResult:null, exiledVoters:[]
  };

}

/* ============ 白天：警长 ============ */
function toggleSheriffCandidate(seat){ const arr=DB.current.dayPending.sheriffCandidates; const i=arr.indexOf(seat); if(i>=0) arr.splice(i,1); else arr.push(seat); }
function skipSheriff(){ const g=DB.current; g.dayPending.sheriffWinner=null; g.dayPending.sheriffDone=true; advanceDayStage(); }
function setSheriffWinner(seat){ const g=DB.current; g.dayPending.sheriffWinner=seat; g.dayPending.sheriffDone=true; seatBy(g,seat).isSheriff=true; advanceDayStage(); }
function advanceDayStage(){
  const g=DB.current;
  if(g.dayStage==='sheriff'){ g.dayStage='announce'; }
  else if(g.dayStage==='announce'){
    g.dayStage = g.dayPending.hunterQueue.length ? 'hunter' : 'vote';
    if(g.dayStage==='hunter') g.dayPending.hunterActive=g.dayPending.hunterQueue[0];
  }
  else if(g.dayStage==='hunter'){
    g.dayPending.hunterQueue.shift();
    if(g.dayPending.hunterQueue.length){ g.dayPending.hunterActive=g.dayPending.hunterQueue[0]; }
    else { g.dayStage='vote'; g.dayPending.hunterActive=null; checkWin(g); }
  }

}
function dayBack(){

  else if(g.dayStage==='vote'){ g.dayStage='announce'; g.dayPending.pkCandidates=null; g.dayPending.votes={}; }

}
function hunterShoot(shooterSeat, targetSeat){

/* ============ 白天：投票 ============ */
function voteEligibleSeats(g){ return g.dayPending.pkCandidates ? g.dayPending.pkCandidates : aliveSeats(g).map(s=>s.seat); }
function voterSeats(g){
  if(g.dayPending.pkCandidates){ return aliveSeats(g).map(s=>s.seat).filter(sn=>!g.dayPending.pkCandidates.includes(sn) && seatBy(g,sn).canVote); }
  return aliveSeats(g).map(s=>s.seat).filter(sn=>seatBy(g,sn).canVote);
}
function setVote(voterSeat, targetVal){ DB.current.dayPending.votes[voterSeat]=targetVal; }
function cancelPK(){ DB.current.dayPending.pkCandidates=null; DB.current.dayPending.votes={}; render(); }
function tallyVotes(){
  const g=DB.current; const votes=g.dayPending.votes; const tally={};
  voterSeats(g).forEach(vs=>{
    const t=votes[vs]; if(!t || t==='abstain') return;
    const w=seatBy(g,vs).isSheriff?1.5:1;
    tally[t]=(tally[t]||0)+w;
  });
  let max=0, leaders=[];
  Object.entries(tally).forEach(([seat,w])=>{ seat=Number(seat); if(w>max){max=w;leaders=[seat];} else if(w===max && max>0){leaders.push(seat);} });
  if(max===0){ g.dayPending.exiledSeat=null; g.dayPending.safeDay=true; g.dayStage='resolve'; saveDB(); render(); return; }
  if(leaders.length===1){
    g.dayPending.exiledSeat=leaders[0]; g.dayPending.safeDay=false;
    g.dayPending.exiledVoters=Object.entries(votes).filter(([v,t])=>t!=='abstain' && Number(t)===leaders[0]).map(([v])=>Number(v));
    g.dayStage='resolve'; saveDB(); render(); return;
  }
  if(g.dayPending.pkCandidates){ g.dayPending.exiledSeat=null; g.dayPending.safeDay=true; g.dayStage='resolve'; saveDB(); render(); return; }
  g.dayPending.pkCandidates=leaders; g.dayPending.votes={}; render();
}
function resolveBack(){ DB.current.dayStage='vote'; render(); }
function applyVoteOutcome(){
