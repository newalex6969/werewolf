  if(exSeat){
    const s=seatBy(g,exSeat);
    if(s.role==='白痴' && !s.idiotRevealed){ s.idiotRevealed=true; s.canVote=false; g.dayPending.idiotSaved=true; }
    else if(s.role==='血月使徒' && !g.seats.some(s2=>s2.alive && s2.seat!==exSeat && campOf(s2.role)==='wolf')){
      g.dayLog.push({day:g.day, sheriff:g.dayPending.sheriffWinner, exiled:exSeat, safeDay:false, idiotSaved:false, moonApostleLastStand:true});
      g.moonApostleFinal={seat:exSeat};
      g.night+=1;
      g.nightSteps=['moonapostle-final']; g.nightStepIndex=0; g.phase='night';
      g.nightPending={moonApostleFinalTarget:null};
      saveDB(); render(); return;
    }
    else {
      const casc=killSeat(g,exSeat,'放逐',g.day);
      checkWolfBroTrigger(g,casc);
      let hunterSeats=casc.filter(c=>seatBy(g,c.seat).role==='猎人').map(c=>c.seat);
      if(s.role==='炸弹人'){
        const voters=(g.dayPending.exiledVoters||[]).filter(v=>v!==exSeat);
        voters.forEach(v=>{
          const vs=seatBy(g,v);
          if(vs && vs.alive) killSeat(g,v,'炸弹人引爆',g.day);
        });
        if(aliveSeats(g).length===0){
          g.dayLog.push({day:g.day, sheriff:g.dayPending.sheriffWinner, exiled:exSeat, safeDay:false, idiotSaved:false});
          g.winner='炸弹人'; g.winnerReason=exSeat+'号炸弹人放逐时引爆全场，单独获胜'; g.phase='ended';
          saveDB(); render(); return;
        }
      }
      if(hunterSeats.length) g.dayPending.hunterQueueDay=hunterSeats;
    }
  }
  g.dayLog.push({day:g.day, sheriff:g.dayPending.sheriffWinner, exiled:exSeat, safeDay:g.dayPending.safeDay, idiotSaved:g.dayPending.idiotSaved});
  checkWin(g);
  if(!g.winner && g.dayPending.hunterQueueDay && g.dayPending.hunterQueueDay.length){
    g.dayStage='hunter'; g.dayPending.hunterQueue=g.dayPending.hunterQueueDay; g.dayPending.hunterActive=g.dayPending.hunterQueue[0]; g.dayPending.hunterQueueDay=null;
  } else if(!g.winner){ g.dayStage='done'; }
  saveDB(); render();
}

/* ============ 胜负判定 ============ */
function checkWin(g){
  if(g.winner) return;
  const wolves=g.seats.filter(s=>s.alive && campOf(s.role)==='wolf').length;
  const gods=g.seats.filter(s=>s.alive && campOf(s.role)==='god').length;
  const vils=g.seats.filter(s=>s.alive && s.role==='平民').length;
  const good=gods+vils;
  const hasGodsInGame = Object.entries(g.roleCounts||{}).some(([r,c])=>c>0 && campOf(r)==='god');
  const hasVilsInGame = (g.roleCounts||{})['平民']>0;
  if(wolves===0){ g.winner='好人阵营'; g.winnerReason='狼人全部出局'; g.phase='ended'; }
  else if(good===0){ g.winner='狼人阵营'; g.winnerReason='屠城'; g.phase='ended'; }
  else if(gods===0 && hasGodsInGame){ g.winner='狼人阵营'; g.winnerReason='屠神'; g.phase='ended'; }
  else if(vils===0 && hasVilsInGame){ g.winner='狼人阵营'; g.winnerReason='屠民'; g.phase='ended'; }
  if(g.winner) saveDB();
}
function forceEndGame(winner){ const g=DB.current; g.winner=winner; g.winnerReason='上帝手动结束'; g.phase='ended'; saveDB(); render(); }
function goNextNight(){ const g=DB.current; beginNight(g); saveDB(); render(); }
function saveToHistory(){
  const g=DB.current;
  DB.history.unshift({id:g.id, createdAt:g.createdAt, playerCount:g.playerCount, boardName:g.boardName, seats:g.seats, winner:g.winner, winnerReason:g.winnerReason, nightLog:g.nightLog, dayLog:g.dayLog, nights:g.night});
  DB.current=null; saveDB(); go('home'); toast('本局已保存到历史记录');
}

/* ============ 逐夜详情格式化 ============ */
function seatLabel(seatsArr, num){ if(!num && num!==0) return ''; const s=seatsArr.find(x=>x.seat===num); return s? (num+'号 '+s.name) : (num+'号'); }
function formatNightLog(n, seatsArr){
  const lines=[];
  if(n.moonApostleFinal){
    lines.push('🌑 血月使徒末日回刀：单独刺杀了 '+seatLabel(seatsArr,n.moonApostleFinalTarget));
    return lines;
  }
  if(n.cupid) lines.push('丘比特：连结了 '+seatLabel(seatsArr,n.cupid[0])+' 与 '+seatLabel(seatsArr,n.cupid[1])+' 为情侣');
  if(n.heiwangTarget) lines.push('黑狼王：查验 '+seatLabel(seatsArr,n.heiwangTarget)+'，真实身份为「'+n.heiwangResult+'」');
  if(n.charmTarget) lines.push('狼美人：魅惑了 '+seatLabel(seatsArr,n.charmTarget));
  if(n.nightmareTarget) lines.push('梦魇：恐惧了 '+seatLabel(seatsArr,n.nightmareTarget)+(n.nightmareBlockedWolf?'（误中狼队友，当晚狼人强制空刀）':'，其当晚技能失效'));
  lines.push('守卫：'+(n.guardTarget? '守护 '+seatLabel(seatsArr,n.guardTarget) : '空守'));
  if(n.angelTarget) lines.push('守护天使：守护 '+seatLabel(seatsArr,n.angelTarget));
  if(n.gargoyleTarget) lines.push('石像鬼：查验 '+seatLabel(seatsArr,n.gargoyleTarget)+'，结果为「'+n.gargoyleResult+'」');
  if(n.scapegoatTarget) lines.push('蛊惑师：指定了替死鬼 '+seatLabel(seatsArr,n.scapegoatTarget));
  {
    const wts=[n.wolfTarget, n.wolfTarget2].filter(t=>t);
    if(wts.length===0) lines.push('狼人：空刀');
    else if(wts.length===1) lines.push('狼人：击杀 '+seatLabel(seatsArr,wts[0]));
    else lines.push('狼人：🐺🐺 双刀击杀 '+wts.map(t=>seatLabel(seatsArr,t)).join('、'));
  }
  if(n.witchHeal) lines.push('女巫：使用解药救了 '+seatLabel(seatsArr,n.witchHealTarget||n.wolfTarget));
  if(n.witchPoisonTarget) lines.push('女巫：使用毒药毒了 '+seatLabel(seatsArr,n.witchPoisonTarget));
  if(!n.witchHeal && !n.witchPoisonTarget) lines.push('女巫：未使用药水');
  if(n.seerTarget) lines.push('预言家：查验 '+seatLabel(seatsArr,n.seerTarget)+'，结果为「'+n.seerResult+'」');
  if(n.mediumTarget) lines.push('通灵师：查验死者 '+seatLabel(seatsArr,n.mediumTarget)+'，身份为「'+n.mediumResult+'」');
  if(n.demonTarget) lines.push('恶魔：单独查验了 '+seatLabel(seatsArr,n.demonTarget)+'，结果「'+(n.demonResult||'—')+'」(只告诉恶魔)'+(n.demonBlocked?'；恶魔夜间免疫，'+n.demonBlocked+' 次攻击无效':''));
  if(n.dreamTarget){
    let dt='摄梦人：今晚的入梦者是 '+seatLabel(seatsArr,n.dreamTarget);
    const dtx=[];
    if(n.dreamImmune) dtx.push('挡住了 '+n.dreamImmune+' 次夜间攻击');
    if(n.dreamChain) dtx.push('连续两晚入梦，当夜结束即死亡');
    if(n.dreamLinked) dtx.push('与摄梦人共死');
    if(dtx.length) dt+='（'+dtx.join('；')+'）';
    lines.push(dt);
  }
  if(n.demonHunterTarget) lines.push('猎魔人：狩猎了 '+seatLabel(seatsArr,n.demonHunterTarget)+'，结果为「'+n.demonHunterResult+'」，'+(n.demonHunterResult==='狼人'?'狩猎成功':'猎魔人反噬身亡'));
  if(n.elderTarget) lines.push('禁言长老：禁言了 '+seatLabel(seatsArr,n.elderTarget));
  if(n.bearRoar!==undefined && n.bearRoar!==null) lines.push('驯熊师：'+(n.bearRoar?'今晚咆哮了（身边有狼人）':'今晚很安静（身边没有狼人）'));
  if(n.deathCauses){ lines.push('死亡：'+(n.deathCauses.length? n.deathCauses.map(d=>seatLabel(seatsArr,d.seat)+'（'+d.cause+'）').join('、') : '平安夜')); }
  else { lines.push('死亡：'+(n.deaths.length? n.deaths.map(d=>seatLabel(seatsArr,d)).join('、') : '平安夜')); }
  if(n.notes) lines.push('其他记录：'+n.notes);
  return lines;
}

      html+=`<div class="field-row"><label for="seatField${seat.seat}">${seat.seat} 号</label><input id="seatField${seat.seat}" type="text" list="rosterList" data-action="seat-name" data-seat="${seat.seat}" value="${seat.name}" placeholder="玩家姓名/昵称" aria-label="${seat.seat} 号座位玩家姓名"></div>`;
    });
    html+=`</div>`;
    html+=`<datalist id="rosterList">${DB.roster.map(p=>`<option value="${p.name}">`).join('')}</datalist>`;
    html+=`<button class="btn btn-primary" data-action="confirm-seats">下一步：分配身份</button></div>`;
  } else if(s.step===4){
    const assign=s.roleAssign||{}; const rem=remainingRoleCounts();
    const rolesInPlay=Object.entries(s.roleCounts).filter(([r,c])=>c>0).map(([r])=>r);
    html+=`<div class="section"><div class="steplink" data-action="setup-back">‹ 上一步</div>
      <div class="card-title">分配身份</div>
      <div class="info-strip">如果你们用的是实体卡牌、且你已经知道每个人的身份，请按实际发到的牌为每位玩家选择身份；如果想让本工具帮你随机分配，点"随机分配"。</div>
      <button class="btn btn-gold" style="margin-bottom:10px;" data-action="random-assign">随机分配全部身份</button>
      <div class="info-strip" style="margin-top:0;">如果是线下抽卡、你自己也不知道谁是谁，选这个：游戏会直接开始，首夜按顺序逐一喊身份，你边观察玩家反应边点选记录，其余没被认领的座位最后自动记为平民。</div>
      <button class="btn btn-ghost" style="margin-bottom:14px;" data-action="identify-mode-start">🌙 线下抽卡，首夜边观察边记录</button>`;
    s.seats.forEach(seat=>{
      const cur=assign[seat.seat]||'';
      html+=`<div class="field"><label>${seat.seat} 号 · ${seat.name}</label>
        <select data-action="manual-role" data-seat="${seat.seat}">
          <option value="">选择身份</option>
          ${rolesInPlay.map(r=>{ const disabled=(r!==cur) && rem[r]<=0; return `<option value="${r}" ${cur===r?'selected':''} ${disabled?'disabled':''}>${r}${disabled?'（已用完）':''}</option>`; }).join('')}
        </select></div>`;
    });
    html+=`<button class="btn btn-primary" data-action="confirm-roles">开始游戏</button></div>`;
  }
  return html;
}

/* ============ 顶部栏 ============ */
function topbar(title, backAction, backLabel){
  const act=backAction||'exit-home', lbl=backLabel||'首页';
  return `<div class="topbar" id="navBar"><div class="back" role="button" tabindex="0" aria-label="${lbl==='首页'?'返回首页':'返回当前对局'}" data-action="${act}"><span class="chevron" aria-hidden="true">‹</span><span class="backlabel">${lbl}</span></div><h1>${title}</h1></div>`;
}

/* ============ 游戏进行页 ============ */
function renderPlay(){
  const g=DB.current;
  if(!g) return renderHome();
  if(g.phase==='ended') return renderEnded(g);
  let html=topbar(g.phase==='night'?'第'+g.night+'夜':'第'+g.day+'天');
  html+=`<div class="section">`;
  html+= g.phase==='night' ? `<div class="phase-banner night"><div class="icon">${ICO.moon}</div><div><div class="t1 serif">天黑请闭眼</div><div class="t2">第 ${g.night} 夜 · 存活 ${aliveSeats(g).length}/${g.playerCount} 人</div></div></div>`
                            : `<div class="phase-banner"><div class="icon">${ICO.sun}</div><div><div class="t1 serif">天亮了</div><div class="t2">第 ${g.day} 天 · 存活 ${aliveSeats(g).length}/${g.playerCount} 人</div></div></div>`;
  if(g.phase==='day') html+=renderSpecialActionsBar(g);
  if(timer.running||timer.left<timer.dur){
    const curT=(ensureTimerOrder()[timer.idx]||null);
    html+=`<div class="tm-strip"><span class="tm-strip-clock" id="tmClock">${fmtClock(timer.left)}</span><span class="tm-strip-who">${curT?('第 '+(timer.idx+1)+' 位 · '+curT.seat+' 号 '+curT.name):'发言计时'}</span><span class="tm-strip-actions"><span class="chip sm" data-action="timer-toggle">${timer.running?'暂停':'继续'}</span><span class="chip sm" data-action="timer-next">下一位</span></span></div>`;
  }
  html+= `<div class="linkbtn" data-action="toggle-overview">${ICO.eye} 查看全部身份、状态与逐夜记录</div>`;
  html+= `<div class="linkbtn" data-action="open-tools">抽号器与发言计时</div>`;
  if(g.showOverview) html+=renderOverview(g);
  if(g.phase==='night') html+=renderNightStep(g);
  else { html+= g.dayPending.specialAction ? renderSpecialAction(g) : renderDayStage(g); }
  html+=`<div class="divider"></div><div class="btn btn-danger-outline btn-sm" data-action="force-end-open" style="margin:0 auto;">强制结束本局</div></div>`;
  return html;
}
function renderSpecialActionsBar(g){
  const chips=[];
  if(livingOfRole(g,'白狼王')) chips.push({k:'baiwang', label:'💥 白狼王自爆'});
  if(livingOfRole(g,'血月使徒')) chips.push({k:'moonapostle', label:'🌑 血月使徒自爆'});
  if(livingOfRole(g,'骑士') && !g.knightUsed) chips.push({k:'knight', label:'⚔️ 骑士决斗'});
  if(livingOfRole(g,'守墓人') && g.dayPending.deathsToAnnounce.length && g.gravekeeperLastUsedDay!==g.day) chips.push({k:'gravekeeper', label:'🪦 守墓人查看死者'});
  if(!chips.length) return '';
  return `<div class="card"><div class="card-title">特殊技能</div><div class="grid-chips">${chips.map(c=>`<div class="chip sm" data-action="open-special" data-kind="${c.k}">${c.label}</div>`).join('')}</div></div>`;
}
function renderOverview(g){
  let html=`<div class="card card-strong"><div class="card-title">全部座位（仅你可见）</div><div class="seat-grid">`;
  g.seats.forEach(s=>{
    html+=`<div class="seat-tile ${!s.alive?'dead':''}">
      ${s.isSheriff?'<div class="crown" aria-label="警长">'+ICO.crown+'</div>':''}
      <div class="num">${s.seat}</div><div class="nm">${s.name}</div>
      <div class="nm" style="color:${roleColorVar(s.role)};font-weight:700;">${s.role}</div>
    </div>`;
  });
  html+=`</div></div>`;
  if(g.nightLog.length){
    html+=`<div class="card"><div class="card-title">逐夜记录</div>`;
    g.nightLog.forEach(n=>{
      html+=`<div style="margin-bottom:10px;"><b style="font-size:13px;">第${n.night}夜</b><div class="loglines">${formatNightLog(n,g.seats).map(l=>'· '+l).join('<br>')}</div></div>`;
    });
    html+=`</div>`;
  }
  return html;
}

/* ---- 夜晚步骤 ---- */
function renderNightStep(g){
  const step=currentNightStepKey(g);
  const p=g.nightPending;
  const backLink = g.nightStepIndex>0 ? `<div class="steplink" data-action="night-back">‹ 上一步</div>` : '';
  if(step && step.indexOf('identify:')===0) return renderIdentifyStep(g,p,backLink,step.slice(9));
  if(step==='moonapostle-final') return renderMoonApostleFinalStep(g,p);
  if(step==='nightmare') return renderNightmareStep(g,p,backLink);
  if(step==='cupid') return renderCupidStep(g,p,backLink);
  if(step==='heiwang') return renderHeiwangStep(g,p,backLink);
  if(step==='charm') return renderCharmStep(g,p,backLink);
  if(step==='guard') return renderGuardStep(g,p,backLink);
  if(step==='angel') return renderAngelStep(g,p,backLink);
  if(step==='scapegoat') return renderScapegoatStep(g,p,backLink);
  if(step==='gargoyle') return renderGargoyleStep(g,p,backLink);
  if(step==='wolf') return renderWolfStep(g,p,backLink);
  if(step==='witch') return renderWitchStep(g,p,backLink);
  if(step==='seer') return renderSeerStep(g,p,backLink);
  if(step==='medium') return renderMediumStep(g,p,backLink);
  if(step==='dreamweaver') return renderDreamStep(g,p,backLink);
  if(step==='demon') return renderDemonStep(g,p,backLink);
  if(step==='demonhunter') return renderDemonHunterStep(g,p,backLink);
  if(step==='elder') return renderElderStep(g,p,backLink);
  if(step==='notes') return renderNotesStep(g,p,backLink);
  return '';
}
function roleHero(name, icon){
  const meta=ROLE_META[name]||{desc:'（这个身份不在当前版本中，仅作记录）'};
  const cls=campOf(name);
  return `<div class="role-hero"><div class="rb badge ${cls}" style="width:64px;height:64px;font-size:28px;margin:0 auto 14px;">${icon}</div><h2>${name}</h2><p>${meta.desc}</p></div>`;
}
function renderIdentifyStep(g,p,backLink,roleName){
  if(roleName==='wolfgroup') return renderWolfgroupIdentify(g,p,backLink);
  if(roleName==='villagers') return renderVillagersIdentify(g,p,backLink);
  return renderSingleIdentify(g,p,backLink,roleName);
}
function renderSingleIdentify(g,p,backLink,roleName){
  const already=g.seats.find(s=>s.role===roleName);
  const pick=(p.identifyPick!==undefined)?p.identifyPick:(already?already.seat:null);
  let html=`<div class="card">${backLink}${roleHero(roleName,'🪪')}
    <div class="info-strip">请让抽到「${roleName}」的玩家举手或示意，你点选对应的座位。</div>
    <div class="seat-grid" style="margin-bottom:14px;">`;
  g.seats.filter(s=>s.role===null || s.role===roleName).forEach(s=>{
    html+=`<div class="seat-tile ${pick===s.seat?'selected':''}" data-action="identify-pick" data-seat="${s.seat}"><div class="num">${s.seat}</div><div class="nm">${s.name}</div></div>`;
  });
  html+=`</div><button class="btn btn-primary" data-action="identify-confirm" data-role="${roleName}" ${pick===null?'disabled':''}>确认，继续</button></div>`;
  return html;
}
function renderWolfgroupIdentify(g,p,backLink){
  const rc=g.roleCounts;
  const wolfRoles=WOLF_CAMP_ROLES.filter(r=>(rc[r]||0)>0);
  if(!p.wolfgroupAssign){
    p.wolfgroupAssign={};
    g.seats.forEach(s=>{ if(s.role && wolfRoles.includes(s.role)) p.wolfgroupAssign[s.seat]=s.role; });
  }
  const assign=p.wolfgroupAssign;
  const usedCount={};
  Object.values(assign).forEach(r=>{ usedCount[r]=(usedCount[r]||0)+1; });
  const totalNeeded=wolfRoles.reduce((a,r)=>a+rc[r],0);
  const totalAssigned=Object.keys(assign).length;
  let html=`<div class="card">${backLink}${roleHero('狼人','🐺')}
    <div class="info-strip">让所有抽到狼人阵营卡牌的玩家睁眼互相确认，然后依次为每一位选择具体身份（共需 ${totalNeeded} 人：${wolfRoles.map(r=>r+'×'+rc[r]).join('、')}）。</div>`;
  g.seats.filter(s=>s.role===null || wolfRoles.includes(s.role)).forEach(s=>{
    const cur=assign[s.seat]||'';
    html+=`<div class="field"><label>${s.seat} 号 · ${s.name}</label>
      <select data-action="wolfgroup-assign" data-seat="${s.seat}">
        <option value="">不是狼人</option>
        ${wolfRoles.map(r=>{ const remain=rc[r]-(usedCount[r]||0)+(cur===r?1:0); const disabled=(r!==cur)&&remain<=0; return `<option value="${r}" ${cur===r?'selected':''} ${disabled?'disabled':''}>${r}${disabled?'（已用完）':''}</option>`; }).join('')}
      </select></div>`;
  });
  html+=`<div class="info-strip">已分配 ${totalAssigned} / ${totalNeeded} 人</div>
    <button class="btn btn-primary" data-action="wolfgroup-confirm" ${totalAssigned===totalNeeded?'':'disabled'}>确认，继续</button></div>`;
  return html;
}
function renderVillagersIdentify(g,p,backLink){
  const remaining=g.seats.filter(s=>s.role===null);
  let html=`<div class="card">${backLink}${roleHero('平民','👤')}
    <div class="info-strip">其余没有被认领特殊身份的玩家，默认都是平民。</div>`;
  if(remaining.length){
    html+=`<div class="seat-grid" style="margin-bottom:14px;">`;
    remaining.forEach(s=>{ html+=`<div class="seat-tile selected"><div class="num">${s.seat}</div><div class="nm">${s.name}</div></div>`; });
    html+=`</div>`;
  } else { html+=`<div class="info-strip">没有剩余座位（本局没有平民）。</div>`; }
  html+=`<button class="btn btn-primary" data-action="identify-villagers-confirm">确认，继续</button></div>`;
  return html;
}
function seatPicker(g, selected, action, filterFn, opts){
  opts=opts||{};
  const base = opts.pool==='dead' ? g.seats.filter(s=>!s.alive) : aliveSeats(g);
  const iconMap=opts.iconMap||{}; const historyMap=opts.historyMap||{};
  let html=`<div class="seat-grid" style="margin-bottom:14px;">`;
  base.filter(filterFn).forEach(s=>{
    const icon=iconMap[s.seat]||'';
    const hist=historyMap[s.seat];
    let extraStyle=''; let histTag='';
    if(hist){ const col = hist.result==='狼人' ? 'var(--wolf)' : 'var(--good)'; extraStyle=`border-color:${col};`; histTag=`<div class="nm" style="color:${col};font-weight:700;">已查·${hist.result}</div>`; }
    html+=`<div class="seat-tile ${selected===s.seat?'selected':''}" style="${extraStyle}" data-action="${action}" data-seat="${s.seat}">
      ${icon?`<div class="icontag">${icon}</div>`:''}
      <div class="num">${s.seat}</div><div class="nm">${s.name}</div>${histTag}
    </div>`;
  });
  if(!opts.noSkip){ html+=`<div class="seat-tile ${selected===null?'selected':''}" data-action="${action}" data-seat="null"><div class="num">—</div><div class="nm">空过</div></div>`; }
  html+=`</div>`;
  return html;
}
function fearedCard(backLink,name,icon){
  return `<div class="card">${backLink}${roleHero(name,icon)}<div class="info-strip warn-strip">😱 ${name}今晚被梦魇恐惧，技能失效，无法行动。</div><button class="btn btn-primary" data-action="fear-skip">确认，继续</button></div>`;
}
function renderGuardStep(g,p,backLink){
  const guardSeat=livingOfRole(g,'守卫').seat;
  if(isFeared(g,guardSeat)) return fearedCard(backLink,'守卫','🛡');
  const excluded=g.guard.lastProtected;
  return `<div class="card">${backLink}${roleHero('守卫','🛡')}
    <div class="info-strip">${excluded?`上一晚守护的是 ${excluded} 号，今晚不能重复选择。`:'请选择今晚要守护的玩家，也可以选择空守。'}</div>
    ${seatPicker(g, p.guardTarget, 'guard-target', s=>s.seat!==excluded, {iconMap:currentNightIcons(g)})}
    <button class="btn btn-primary" data-action="guard-confirm" ${p.guardTarget===undefined?'disabled':''}>确认并继续</button>
  </div>`;
}
function renderAngelStep(g,p,backLink){
  const angelSeat=livingOfRole(g,'守护天使').seat;
  if(isFeared(g,angelSeat)) return fearedCard(backLink,'守护天使','😇');
  return `<div class="card">${backLink}${roleHero('守护天使','😇')}
    <div class="info-strip">可以连续守护同一人，但不能守护自己。</div>
    ${seatPicker(g, p.angelTarget, 'angel-target', s=>s.seat!==angelSeat, {iconMap:currentNightIcons(g)})}
    <button class="btn btn-primary" data-action="angel-confirm" ${p.angelTarget===undefined?'disabled':''}>确认并继续</button>
  </div>`;
}
function renderGargoyleStep(g,p,backLink){
  const gg=livingOfRole(g,'石像鬼');
  if(isFeared(g,gg.seat)) return fearedCard(backLink,'石像鬼','🗿');
  if(p.gargoyleTarget && !p.gargoyleConfirmed){
    const target=seatBy(g,p.gargoyleTarget); const result=seerDisplay(g,target.role);
    return `<div class="card">${backLink}${roleHero('石像鬼','🗿')}
      <div class="say-block">查验结果（仅你可见）：<b>${p.gargoyleTarget} 号 ${target.name}</b> —— <b style="color:${result==='狼人'?'var(--wolf)':'var(--good)'};">${result}</b></div>
      <div class="steplink" data-action="gargoyle-reselect">‹ 重新选择目标</div>
      <button class="btn btn-primary" data-action="gargoyle-done">已确认，继续</button>
    </div>`;
  }
  return `<div class="card">${backLink}${roleHero('石像鬼','🗿')}
    <div class="info-strip">石像鬼在上半夜独自查验，不参与狼人夜间行动。</div>
    ${seatPicker(g, p.gargoyleTarget, 'gargoyle-target', s=>s.seat!==gg.seat, {iconMap:currentNightIcons(g), historyMap:g.gargoyleHistory})}
  </div>`;
}
function renderMoonApostleFinalStep(g,p){
  const apSeat=g.moonApostleFinal ? g.moonApostleFinal.seat : null;
  const ap=apSeat?seatBy(g,apSeat):null;
  return `<div class="card">${roleHero('血月使徒','🌑')}
    <div class="say-block"><b>${apSeat} 号 ${ap?ap.name:''}</b> 是场上最后一名狼人，被投票放逐后触发"末日回刀"：他不会立刻死亡，游戏强制再进入一夜，由他单独选择一名玩家刺杀。</div>
    <div class="info-strip warn-strip">这一刀不受任何守护/救援效果影响。如果刺杀后达成"屠边"（好人阵营的平民或神职被杀光），狼人阵营将直接逆转获胜；否则血月使徒本人随后死亡，游戏按正常结果继续判定。</div>
    ${seatPicker(g, p.moonApostleFinalTarget, 'moonapostle-final-target', s=>s.seat!==apSeat, {noSkip:true})}
    <button class="btn btn-danger-outline" data-action="moonapostle-final-confirm" ${p.moonApostleFinalTarget?'':'disabled'}>确认最后一刀</button>
  </div>`;
}
function renderWolfStep(g,p,backLink){
  const nightmareBlocksWolf = g.night===1 && p.nightmareTarget && campOf(seatBy(g,p.nightmareTarget).role)==='wolf';
  if(nightmareBlocksWolf){
    return `<div class="card">${backLink}${roleHero('狼人','🐺')}
      <div class="info-strip warn-strip">😱 首夜梦魇与狼队友互不相识，这次恰好恐惧到了自己人（${p.nightmareTarget} 号）——按规则，今晚狼人阵营强制空刀，不会有人死亡。</div>
      <button class="btn btn-primary" data-action="wolf-confirm">确认空刀，继续</button>
    </div>`;
  }
  const prevs=[g.wolf.lastTarget, g.wolf.lastTarget2].filter(t=>t && seatBy(g,t) && seatBy(g,t).alive);
  const double=!!g.wolfBroDoubleKnifeTonight;
  const iconMap={...currentNightIcons(g)};
  prevs.forEach(pr=>{ iconMap[pr]=(iconMap[pr]||'')+'⚠'; });
  let html=`<div class="card">${backLink}${roleHero('狼人','🐺')}`;
  if(double) html+=`<div class="info-strip warn-strip">🐺🐺 狼兄昨天白天出局，触发"双刀"：今晚狼人阵营可以额外多杀一人（两刀都可以选择空刀）。</div>`;
  html+=`<div class="info-strip">向狼人玩家确认今晚要击杀的目标，也可以选择空刀。</div>`;
  html+=`${prevs.length?`<div class="info-strip warn-strip">⚠️ 上一晚狼人的目标是 ${prevs.map(pr=>pr+'号（'+seatBy(g,pr).name+'）').join('、')}，对方存活了下来，再次选择前请与狼人确认清楚。</div>`:''}`;
  html+=`${double?'<div class="card-title">第一刀</div>':''}`;
  html+=seatPicker(g, p.wolfTarget, 'wolf-target', s=>s.seat!==p.wolfTarget2, {iconMap});
  if(double){
    html+=`<div class="card-title" style="margin-top:14px;">第二刀</div>`;
    html+=seatPicker(g, p.wolfTarget2, 'wolf-target2', s=>s.seat!==p.wolfTarget, {iconMap});
  }
  html+=`<button class="btn btn-primary" data-action="wolf-confirm" ${(p.wolfTarget===undefined || (double && p.wolfTarget2===undefined))?'disabled':''}>确认并继续</button></div>`;
  return html;
}
function renderWitchStep(g,p,backLink){
  const witch=livingOfRole(g,'女巫');
  if(isFeared(g,witch.seat)) return fearedCard(backLink,'女巫','🧪');
  const wolfTargets=[p.wolfTarget, p.wolfTarget2].filter(t=>t);
  let html=`<div class="card">${backLink}${roleHero('女巫','🧪')}`;
  if(wolfTargets.length===0){ html+=`<div class="info-strip">昨晚狼人空刀，平安夜。</div>`; }
  else if(wolfTargets.length===1){ html+=`<div class="info-strip">昨晚狼人击杀的是 <b style="color:var(--wolf);">${wolfTargets[0]} 号（${seatBy(g,wolfTargets[0]).name}）</b>。</div>`; }
  else { html+=`<div class="info-strip">🐺🐺 狼兄触发双刀，昨晚狼人击杀的是 <b style="color:var(--wolf);">${wolfTargets.map(t=>t+'号（'+seatBy(g,t).name+'）').join(' 和 ')}</b>。解药只能救其中一人。</div>`; }
  html+=`<div class="card-title">解药</div>`;
  if(g.witch.healUsed){
    html+=`<div class="row" style="margin-bottom:14px;"><div class="info-strip">解药已使用</div></div>`;
  } else if(wolfTargets.length===0){
    html+=`<div class="row" style="margin-bottom:14px;"><div class="info-strip">今晚没有人被刀，无需使用解药。</div></div>`;
  } else {
    html+=`<div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:14px;">`;

/* ---- 白天阶段 ---- */
function renderDayStage(g){
  const stage=g.dayStage;
  if(stage==='sheriff') return renderSheriffStage(g);
  if(stage==='announce') return renderAnnounceStage(g);
  if(stage==='hunter') return renderHunterStage(g);
  if(stage==='vote') return renderVoteStage(g);
  if(stage==='resolve') return renderResolveStage(g);
  if(stage==='done') return renderDoneStage(g);
  return '';
}
function renderSheriffStage(g){
  const cands=g.dayPending.sheriffCandidates;
  let html=`<div class="card"><div class="card-title">警长竞选（第一天）</div>
    <div class="info-strip">选择参与竞选的玩家，再指定当选者；也可以直接跳过本环节。</div>
    <div class="seat-grid" style="margin-bottom:14px;">`;
  aliveSeats(g).forEach(s=>{ html+=`<div class="seat-tile ${cands.includes(s.seat)?'selected':''}" data-action="sheriff-toggle" data-seat="${s.seat}"><div class="num">${s.seat}</div><div class="nm">${s.name}</div></div>`; });
  html+=`</div><div class="card-title" style="margin-top:10px;">当选警长</div><div class="grid-chips" style="margin-bottom:14px;">
    ${cands.length===0?'<div style="color:var(--text-3);font-size:13px;">先选择参选人</div>':cands.map(sn=>`<div class="chip ${g.dayPending.sheriffWinner===sn?'active gold':''}" data-action="sheriff-winner" data-seat="${sn}">${sn}号 ${seatBy(g,sn).name}</div>`).join('')}
  </div><button class="btn btn-ghost" data-action="sheriff-skip">跳过警长竞选</button></div>`;
  return html;
}
function renderAnnounceStage(g){
  const deaths=g.dayPending.deathsToAnnounce;
  const lastLog=g.nightLog[g.nightLog.length-1];
  let html=`<div class="card">`;
  if(g.day===1) html+=`<div class="steplink" data-action="day-back">‹ 上一步</div>`;
  html+=`<div class="card-title">昨夜结果播报</div>`;
  if(deaths.length===0){ html+=`<div class="say-block">昨晚是平安夜，没有玩家死亡。</div>`; }
  else { deaths.slice().sort((a,b)=>a-b).forEach(sn=>{ const s=seatBy(g,sn); html+=`<div class="say-block">${sn} 号玩家（${s.name}）昨夜死亡。</div>`; }); }
  if(lastLog && lastLog.elderTarget){ html+=`<div class="info-strip">🤐 ${lastLog.elderTarget} 号今天被禁言，发言阶段无法说话。</div>`; }
  if(lastLog && (lastLog.dreamLinked||lastLog.dreamChain)){ html+=`<div class="info-strip">💤 入梦者因${lastLog.dreamLinked?'与摄梦人共死':'连续两晚入梦'}出局，请按规则公告。</div>`; }
  else if(lastLog && lastLog.dreamImmune){ html+=`<div class="info-strip">💤 今晚的入梦者受到梦境保护，针对他的夜间攻击都被消耗掉了。</div>`; }
  if(lastLog && lastLog.demonTarget){ html+=`<div class="info-strip">👁 恶魔昨晚查验了 ${lastLog.demonTarget} 号，结果是「${lastLog.demonResult||'—'}」——只告诉恶魔，别说出具体身份。${lastLog.demonBlocked?'（恶魔夜间免疫，'+lastLog.demonBlocked+' 次攻击无效）':''}</div>`; }
  if(lastLog && (lastLog.bearRoar!==undefined && lastLog.bearRoar!==null)){ html+=`<div class="info-strip">🐻 记得向全场播报："驯熊师${lastLog.bearRoar?'咆哮了':'很安静'}"。</div>`; }
  if(lastLog && lastLog.nightmareBlockedWolf){ html+=`<div class="info-strip warn-strip">😱 昨晚梦魇误恐惧了狼队友，狼人强制空刀，这也是平安夜的原因之一。</div>`; }
  if(lastLog && lastLog.demonHunterTarget){ html+=`<div class="info-strip">🗡 猎魔人狩猎了 ${lastLog.demonHunterTarget} 号，${lastLog.demonHunterResult==='狼人'?'狩猎成功':'猎魔人反噬身亡'}（已计入死亡名单）。</div>`; }
  if(lastLog && lastLog.scapegoatTarget){ html+=`<div class="info-strip">🎭 蛊惑师昨晚指定了替死鬼 ${lastLog.scapegoatTarget} 号（仅供你参考，无需公开）。</div>`; }
  html+=`<button class="btn btn-primary" data-action="announce-next">对外播报完毕，继续</button></div>`;
  return html;
}
function renderHunterStage(g){
  const sn=g.dayPending.hunterActive; const s=seatBy(g,sn);
  return `<div class="card"><div class="card-title">猎人技能判定</div>
    <div class="say-block">${sn} 号（${s.name}）是猎人，死因符合开枪条件，可以选择带走一名玩家。</div>
    ${seatPicker(g, null, 'hunter-shoot', x=>x.seat!==sn, {})}
  </div>`;
}
function renderVoteStage(g){
  const pk=g.dayPending.pkCandidates;
  let html=`<div class="card"><div class="steplink" data-action="day-back">‹ 上一步</div><div class="card-title">${pk?'PK 二次投票':'投票放逐'}</div>`;
  if(pk){ html+=`<div class="info-strip">进入 PK：${pk.map(s=>s+'号 '+seatBy(g,s).name).join('、')} 平票，请他们发言后由其余玩家再次投票。</div><div class="linkbtn" data-action="cancel-pk">↺ 取消PK，重新开始本轮投票</div>`; }
  const voters=voterSeats(g); const choices=voteEligibleSeats(g);
  html+=`<div>`;
  voters.forEach(vs=>{
    const sheriffMark = seatBy(g,vs).isSheriff?' '+ICO.crown:'';
    html+=`<div class="vote-row"><div class="who">${vs}号${sheriffMark}</div>
      <select data-action="vote-select" data-voter="${vs}">
        <option value="">未投票</option><option value="abstain">弃票</option>
        ${choices.filter(c=>c!==vs).map(c=>`<option value="${c}" ${g.dayPending.votes[vs]==c?'selected':''}>投给 ${c}号 ${seatBy(g,c).name}</option>`).join('')}
      </select></div>`;
  });
  html+=`</div><button class="btn btn-primary" style="margin-top:14px;" data-action="tally-votes">计算投票结果</button></div>`;
  return html;
}
function renderResolveStage(g){
  const ex=g.dayPending.exiledSeat;
  let html=`<div class="card"><div class="steplink" data-action="resolve-back">‹ 返回投票</div><div class="card-title">放逐结果</div>`;
  if(g.dayPending.safeDay){ html+=`<div class="say-block">投票结果为平票，今天是平安日，无人出局。</div>`; }
  else if(ex){
    const s=seatBy(g,ex);
    const idiotNote = (s.role==='白痴' && !s.idiotRevealed) ? '（该玩家是白痴，放逐后将翻牌免疫出局，不会真正死亡）' : '';
    html+=`<div class="say-block">${ex} 号（${s.name}）将被投票放逐出局。${idiotNote}</div>`;
    if(s.role==='炸弹人'){
      const voters=(g.dayPending.exiledVoters||[]).filter(v=>v!==ex);
      html+=`<div class="info-strip warn-strip">💣 该玩家是炸弹人，放逐后将立即炸死投他票的所有玩家：${voters.length?voters.map(v=>v+'号 '+seatBy(g,v).name).join('、'):'（无人投他票）'}</div>`;
    }
  }
  html+=`<button class="btn btn-primary" data-action="resolve-continue">确认，公布结果</button></div>`;
  return html;
}
function renderDoneStage(g){
  return `<div class="card"><div class="say-block">白天流程已结束，天黑，进入下一夜。</div><button class="btn btn-primary" data-action="next-night">天黑请闭眼 · 进入第${g.night+1}夜</button></div>`;
}

  if(kind==='moonapostle'){
    return `<div class="card"><div class="steplink" data-action="special-cancel">‹ 取消</div>${roleHero('血月使徒','🌑')}
      <div class="info-strip warn-strip">自爆后血月使徒本人不会死亡，但当晚所有神职技能（预言家查验、女巫用药、猎魔人狩猎、守卫守护等）全部被封印无法使用；血月使徒本人当晚也不能参与狼人指刀。随后直接进入下一夜。此操作不可撤销。</div>
      <button class="btn btn-danger-outline" data-action="special-moonapostle-confirm">确认自爆</button>
    </div>`;
  }
  if(kind==='knight'){
    const kn=livingOfRole(g,'骑士');
    return `<div class="card"><div class="steplink" data-action="special-cancel">‹ 取消</div>${roleHero('骑士','⚔️')}
      <div class="info-strip">选择要决斗的玩家：命中狼人则击杀对方，命中好人则骑士自己出局。每局限一次。</div>
      ${seatPicker(g,null,'special-knight-target', s=>s.seat!==kn.seat, {noSkip:true})}
    </div>`;
  }
  if(kind==='gravekeeper'){
    const p=g.dayPending;
    if(p.gravekeeperResult){
      return `<div class="card">${roleHero('守墓人','🪦')}
        <div class="say-block">${p.gravekeeperTarget} 号 的真实身份是 —— <b>${p.gravekeeperResult}</b></div>
        <button class="btn btn-primary" data-action="special-cancel">好的，继续</button>
      </div>`;
    }
    return `<div class="card"><div class="steplink" data-action="special-cancel">‹ 取消</div>${roleHero('守墓人','🪦')}
      <div class="info-strip">选择今晚死亡的玩家查看真实身份。</div>
      <div class="grid-chips">${g.dayPending.deathsToAnnounce.map(sn=>`<div class="chip" data-action="special-gravekeeper-pick" data-seat="${sn}">${sn}号 ${seatBy(g,sn).name}</div>`).join('')}</div>
    </div>`;
  }
  return '';
}

/* ---- 结算页 ---- */
function renderEnded(g){
  let html=topbar('本局结束');
  const win=g.winner;
  html+=`<div class="section"><div class="card card-strong" style="text-align:center;padding:30px 20px;">
    <div style="font-size:34px;margin-bottom:10px;">${win==='好人阵营'?'🌅':'🐺'}</div>
    <div class="serif" style="font-size:22px;font-weight:700;margin-bottom:6px;">${win} 胜利</div>
    <div style="color:var(--text-2);font-size:13.5px;">${g.winnerReason} · 共进行 ${g.night} 夜</div>
  </div><div class="card"><div class="card-title">身份总览</div><div class="seat-grid">`;
  g.seats.forEach(s=>{ html+=`<div class="seat-tile ${!s.alive?'dead':''}"><div class="num">${s.seat}</div><div class="nm">${s.name}</div><div class="nm" style="color:${roleColorVar(s.role)};font-weight:700;">${s.role}</div></div>`; });
  html+=`</div></div><button class="btn btn-gold" data-action="save-history">保存到历史记录</button></div>`;
  return html;
}

/* ============ 历史详情 ============ */
function renderHistoryDetail(id){
  const h=DB.history.find(x=>x.id===id);
  if(!h) return renderHome();
  let html=topbar('对局详情');
  const legacyRoles=h.seats.some(function(x){return x.role && !ROLE_META[x.role];});
  html+=`<div class="section"><div class="card card-strong" style="text-align:center;padding:26px 20px;">
    <div class="serif" style="font-size:19px;font-weight:700;">${h.winner} 胜利</div>
    <div style="color:var(--text-2);font-size:13px;margin-top:4px;">${h.boardName} · ${h.playerCount}人 · ${h.createdAt} · 共${h.nights}夜</div>
    ${legacyRoles?'<div class="info-strip" style="margin:12px 0 0;text-align:left;">这一局存有旧版本的身份数据，其中的身份名称没有对应的说明，其余记录不受影响。</div>':''}
  </div><div class="card"><div class="card-title">最终身份</div><div class="seat-grid">`;
  h.seats.forEach(s=>{ html+=`<div class="seat-tile ${!s.alive?'dead':''}"><div class="num">${s.seat}</div><div class="nm">${s.name}</div><div class="nm" style="color:${roleColorVar(s.role)};font-weight:700;">${s.role}</div></div>`; });
  html+=`</div></div><div class="card"><div class="card-title">逐夜记录</div>`;
  h.nightLog.forEach(n=>{ html+=`<div style="margin-bottom:10px;"><b style="font-size:13px;">第${n.night}夜</b><div class="loglines">${formatNightLog(n,h.seats).map(l=>'· '+l).join('<br>')}</div></div>`; });
  html+=`</div></div>`;
  return html;
}

/* ============ 事件绑定 ============ */
function bindEvents(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    const action=el.getAttribute('data-action');
    if(el._bound) return; el._bound=true;
    if(el.tagName==='SELECT'){ el.addEventListener('change', ()=>handleAction(action, el)); return; }
    if(el.tagName==='INPUT' || el.tagName==='TEXTAREA'){ el.addEventListener('input', ()=>handleAction(action, el)); return; }
    el.addEventListener('click', ()=>handleAction(action, el));
  });
}
function handleAction(action, el){
  const g=DB.current;
  switch(action){
    case 'new-game': startSetup(); break;
    case 'resume-game': go('play'); break;
    case 'go-roster': go('roster'); break;
    case 'open-history': go('historyDetail', {id: el.getAttribute('data-id')}); break;
    case 'history-del': { const hid=el.getAttribute('data-id'); const hh=DB.history.find(x=>x.id===hid); if(!hh) break;
      openSheet({title:'删除这条记录？', message:'「'+hh.boardName+' · '+hh.createdAt+'」会从历史记录中移除，无法撤销。',
        actions:[{label:'删除这条记录', kind:'danger', onPick:function(){ DB.history=DB.history.filter(x=>x.id!==hid); saveDB(); render(); toast('已删除该记录'); }},{label:'取消'}]});
      break; }
    case 'install-app': installApp(); break;
    case 'backup-export': exportBackup(); break;
    case 'backup-import': importBackup(); break;
    case 'draw-one': drawOne(); break;
    case 'draw-reset': drawState.drawn=[]; drawState.last=null; drawState.orderList=null; render(); toast('已重置抽号'); break;
    case 'draw-norepeat': drawState.noRepeat=!drawState.noRepeat; render(); break;
    case 'draw-order': drawShuffleOrder(); break;
    case 'timer-set': timer.dur=Number(el.getAttribute('data-sec'))||180; timerPause(); timer.left=timer.dur; timer.done=false; render(); break;
    case 'timer-toggle': if(timer.running){ timerPause(); } else { timerStart(); } render(); break;
    case 'timer-next': timerNext(); break;
    case 'timer-reset': timerReset(); render(); break;
    case 'open-tools': { const dm=document.getElementById('drawMax'); if(dm) drawState.max=Number(dm.value)||drawState.max; go('tools',{from:nav.view}); break; }
    case 'history-clear': { if(!DB.history.length) break;
      openSheet({title:'清空全部历史记录？', message:'共 '+DB.history.length+' 局记录会被删除，无法撤销。玩家名单和自定义配置不受影响。',
        actions:[{label:'清空 '+DB.history.length+' 局记录', kind:'danger', onPick:function(){ DB.history=[]; saveDB(); render(); toast('历史记录已清空'); }},{label:'取消'}]});
      break; }
    case 'exit-home': exitToHome(); break;
    case 'roster-add': { const input=document.getElementById('rosterNewName'); if(addToRoster(input.value)){ input.value=''; render(); } break; }
    case 'roster-del': { const rid=el.getAttribute('data-id'); const ri=DB.roster.findIndex(p=>p.id===rid); if(ri<0) break; const removed=DB.roster[ri];
      DB.roster=DB.roster.filter(p=>p.id!==rid); saveDB(); render();
      toast('已移除 '+removed.name,'撤销',function(){ const at=Math.min(ri,DB.roster.length); DB.roster.splice(at,0,removed); saveDB(); render(); toast('已恢复 '+removed.name); });
      break; }

    case 'setup-back': setupBack(); break;
    case 'pick-count': pickCount(Number(el.getAttribute('data-n'))); break;
    case 'to-step2': setupState.step=2; render(); break;
    case 'pick-preset': { const p=PRESETS.find(pp=>pp.name===el.getAttribute('data-name') && pp.count===setupState.count); pickPreset(p); break; }
    case 'pick-custom-preset': { const p=DB.customPresets.find(pp=>pp.id===el.getAttribute('data-id')); pickPreset(p); break; }
    case 'del-custom-preset': deleteCustomPreset(el.getAttribute('data-id')); break;
    case 'pick-custom': useCustomBoard(); break;
    case 'role-inc': adjustRole(el.getAttribute('data-role'), 1); break;
    case 'role-dec': adjustRole(el.getAttribute('data-role'), -1); break;
    case 'ext-toggle': toggleExtendedRole(el.getAttribute('data-role')); break;
    case 'ext-desc': { const dr=el.getAttribute('data-role'); if(!setupState) break; setupState.extDescOpen=setupState.extDescOpen||{}; setupState.extDescOpen[dr]=!setupState.extDescOpen[dr]; render(); break; }
    case 'save-preset': saveCustomPreset(); break;
    case 'confirm-board': confirmBoardStep(); break;
    case 'seat-name': setSeatName(Number(el.getAttribute('data-seat')), el.value); break;
    case 'confirm-seats': confirmSeatsStep(); break;
    case 'random-assign': randomAssignRoles(); break;
    case 'manual-role': manualSetRole(Number(el.getAttribute('data-seat')), el.value); render(); break;
    case 'confirm-roles': confirmRolesStep(); break;
    case 'identify-mode-start': startIdentifyGame(); break;

    case 'toggle-overview': g.showOverview=!g.showOverview; render(); break;
    case 'force-end-open': openForceEndModal(); break;

    case 'night-back': nightStepBack(g); break;
    case 'identify-pick': g.nightPending.identifyPick=Number(el.getAttribute('data-seat')); render(); break;
    case 'identify-confirm': {
      const role=el.getAttribute('data-role');
      const already=g.seats.find(s=>s.role===role);
      const pick = g.nightPending.identifyPick!==undefined ? g.nightPending.identifyPick : (already?already.seat:null);
      if(pick===null || pick===undefined){ toast('请先选择玩家'); break; }
      if(already && already.seat!==pick) already.role=null;
      seatBy(g,pick).role=role;
      g.nightPending.identifyPick=undefined;
      nightStepNext(g); break;
    }
    case 'wolfgroup-assign': {
      if(!g.nightPending.wolfgroupAssign) g.nightPending.wolfgroupAssign={};
      const seat=Number(el.getAttribute('data-seat'));
      if(el.value){ g.nightPending.wolfgroupAssign[seat]=el.value; } else { delete g.nightPending.wolfgroupAssign[seat]; }
      render(); break;
    }
    case 'wolfgroup-confirm': {
      const assign=g.nightPending.wolfgroupAssign||{};
      g.seats.forEach(s=>{ if(s.role && WOLF_CAMP_ROLES.includes(s.role) && assign[s.seat]!==s.role) s.role=null; });
      Object.entries(assign).forEach(([seat,role])=>{ seatBy(g,Number(seat)).role=role; });
      g.nightPending.wolfgroupAssign=undefined;
      nightStepNext(g); break;
    }
    case 'identify-villagers-confirm': { g.seats.forEach(s=>{ if(s.role===null) s.role='平民'; }); nightStepNext(g); break; }
    case 'guard-target': g.nightPending.guardTarget = el.getAttribute('data-seat')==='null'?null:Number(el.getAttribute('data-seat')); render(); break;
    case 'guard-confirm': nightStepNext(g); break;
    case 'angel-target': g.nightPending.angelTarget = el.getAttribute('data-seat')==='null'?null:Number(el.getAttribute('data-seat')); render(); break;
    case 'angel-confirm': nightStepNext(g); break;
    case 'gargoyle-target': { const v=el.getAttribute('data-seat'); if(v==='null') break; const t=Number(v); g.nightPending.gargoyleTarget=t; g.nightPending.gargoyleResult=(g.nightPending.dreamTarget===t)?'被梦境阻挡（查验失败）':seerDisplay(g,seatBy(g,t).role); render(); break; }
    case 'gargoyle-reselect': g.nightPending.gargoyleTarget=null; g.nightPending.gargoyleResult=null; render(); break;
    case 'gargoyle-done': g.gargoyleHistory[g.nightPending.gargoyleTarget]={result:g.nightPending.gargoyleResult, night:g.night}; g.nightPending.gargoyleConfirmed=true; nightStepNext(g); break;
    case 'wolf-target': g.nightPending.wolfTarget = el.getAttribute('data-seat')==='null'?null:Number(el.getAttribute('data-seat')); render(); break;
    case 'wolf-target2': g.nightPending.wolfTarget2 = el.getAttribute('data-seat')==='null'?null:Number(el.getAttribute('data-seat')); render(); break;
    case 'wolf-confirm': nightStepNext(g); break;
    case 'witch-heal-pick': g.nightPending.witchHeal=true; g.nightPending.witchHealTarget=Number(el.getAttribute('data-seat')); g.nightPending.witchPoisonTarget=null; render(); break;
    case 'witch-heal-clear': g.nightPending.witchHeal=false; g.nightPending.witchHealTarget=null; render(); break;
    case 'witch-poison-pick': g.nightPending.witchPoisonTarget = Number(el.getAttribute('data-seat')); g.nightPending.witchHeal=false; g.nightPending.witchHealTarget=null; render(); break;
    case 'witch-poison-clear': g.nightPending.witchPoisonTarget=null; render(); break;
    case 'witch-confirm': nightStepNext(g); break;
    case 'seer-target': { const v=el.getAttribute('data-seat'); if(v==='null') break; const t=Number(v); g.nightPending.seerTarget=t; g.nightPending.seerResult = (g.nightPending.dreamTarget===t)?'被梦境阻挡（查验失败）':seerDisplay(g,seatBy(g,t).role); render(); break; }
    case 'seer-reselect': g.nightPending.seerTarget=null; g.nightPending.seerResult=null; render(); break;
    case 'seer-done': g.seerHistory[g.nightPending.seerTarget]={result:g.nightPending.seerResult, night:g.night}; g.nightPending.seerConfirmed=true; nightStepNext(g); break;
    case 'medium-target': { const v=el.getAttribute('data-seat'); if(v==='null') break; const t=Number(v); g.nightPending.mediumTarget=t; g.nightPending.mediumResult=seatBy(g,t).role; render(); break; }
    case 'medium-reselect': g.nightPending.mediumTarget=null; g.nightPending.mediumResult=null; render(); break;
    case 'medium-done': g.nightPending.mediumConfirmed=true; nightStepNext(g); break;
    case 'dream-target': g.nightPending.dreamTarget = el.getAttribute('data-seat')==='null'?null:Number(el.getAttribute('data-seat')); render(); break;
    case 'demon-target': { const v=el.getAttribute('data-seat'); if(v==='null') break; const t=Number(v); g.nightPending.demonTarget=t;
      g.nightPending.demonResult = (g.nightPending.dreamTarget===t) ? '被梦境阻挡（查验失败）' : (campOf(seatBy(g,t).role)==='god' ? '是神职' : '不是神职'); render(); break; }
    case 'demon-done': g.nightPending.demonConfirmed=true; nightStepNext(g); break;
    case 'dream-random': { const dw=livingOfRole(g,'摄梦人'); const pool=aliveSeats(g).filter(s=>!dw||s.seat!==dw.seat); if(!pool.length) break; g.nightPending.dreamTarget=pool[Math.floor(Math.random()*pool.length)].seat; render(); break; }
    case 'dream-confirm': nightStepNext(g); break;
    case 'elder-target': g.nightPending.elderTarget = el.getAttribute('data-seat')==='null'?null:Number(el.getAttribute('data-seat')); render(); break;
    case 'elder-confirm': nightStepNext(g); break;
    case 'cupid-pick': { const sn=Number(el.getAttribute('data-seat')); const p=g.nightPending;
      if(p.cupidA===sn){ p.cupidA=null; } else if(p.cupidB===sn){ p.cupidB=null; }
      else if(p.cupidA==null){ p.cupidA=sn; } else if(p.cupidB==null){ p.cupidB=sn; }
      render(); break; }
    case 'cupid-confirm': nightStepNext(g); break;
    case 'heiwang-target': { const v=el.getAttribute('data-seat'); if(v==='null') break; const t=Number(v); g.nightPending.heiwangTarget=t; g.nightPending.heiwangResult=(g.nightPending.dreamTarget===t)?'被梦境阻挡（查验失败）':(campOf(seatBy(g,t).role)==='wolf'?'狼人':'好人'); render(); break; }
    case 'heiwang-reselect': g.nightPending.heiwangTarget=null; g.nightPending.heiwangResult=null; render(); break;
    case 'heiwang-done': g.nightPending.heiwangConfirmed=true; nightStepNext(g); break;
    case 'charm-target': g.nightPending.charmTarget = el.getAttribute('data-seat')==='null'?null:Number(el.getAttribute('data-seat')); render(); break;
    case 'charm-confirm': nightStepNext(g); break;
    case 'nightmare-target': g.nightPending.nightmareTarget = el.getAttribute('data-seat')==='null'?null:Number(el.getAttribute('data-seat')); render(); break;
    case 'nightmare-confirm': nightStepNext(g); break;
    case 'fear-skip': nightStepNext(g); break;
    case 'scapegoat-target': g.nightPending.scapegoatTarget = el.getAttribute('data-seat')==='null'?null:Number(el.getAttribute('data-seat')); render(); break;
    case 'scapegoat-confirm': nightStepNext(g); break;
    case 'demonhunter-target': { const v=el.getAttribute('data-seat'); if(v==='null') break; const t=Number(v); g.nightPending.demonHunterTarget=t; g.nightPending.demonHunterResult=campOf(seatBy(g,t).role)==='wolf'?'狼人':'好人'; render(); break; }
    case 'demonhunter-reselect': g.nightPending.demonHunterTarget=null; g.nightPending.demonHunterConfirmed=false; render(); break;
    case 'demonhunter-done': g.nightPending.demonHunterConfirmed=true; nightStepNext(g); break;
    case 'moonapostle-final-target': { const v=el.getAttribute('data-seat'); if(v==='null') break; g.nightPending.moonApostleFinalTarget=Number(v); render(); break; }
    case 'moonapostle-final-confirm': {
      const target=g.nightPending.moonApostleFinalTarget; if(!target) break;
      if(!confirm('确定要以这个目标结束血月使徒的最后一战吗？此操作不可撤销。')) break;
      const apSeat=g.moonApostleFinal.seat;
      if(!((livingOfRole(g,'恶魔')||{}).seat===target)) killSeat(g,target,'血月使徒最后一战刺杀',g.day);   /* 恶魔夜间免疫 */
      g.nightLog.push({night:g.night, moonApostleFinal:true, moonApostleFinalTarget:target});
      checkWin(g);
      if(g.winner){ g.winnerReason='血月使徒末日回刀，'+g.winnerReason; }
      if(!g.winner){
        killSeat(g,apSeat,'放逐（血月使徒最后一战未达成屠边）',g.day);
        checkWin(g);
      }
      g.moonApostleFinal=null;
      if(!g.winner){ beginDay(g,[]); }
      saveDB(); render(); break;
    }
    case 'night-notes': g.nightPending.notes=el.value; break;
    case 'notes-confirm': nightStepNext(g); break;

    case 'sheriff-toggle': toggleSheriffCandidate(Number(el.getAttribute('data-seat'))); render(); break;
    case 'sheriff-winner': setSheriffWinner(Number(el.getAttribute('data-seat'))); break;
    case 'sheriff-skip': skipSheriff(); break;
    case 'day-back': dayBack(); break;
    case 'announce-next': advanceDayStage(); break;
    case 'hunter-shoot': { const v=el.getAttribute('data-seat'); hunterShoot(g.dayPending.hunterActive, v==='null'?null:Number(v)); break; }
    case 'vote-select': setVote(Number(el.getAttribute('data-voter')), el.value); break;
    case 'cancel-pk': cancelPK(); break;
    case 'tally-votes': tallyVotes(); break;
    case 'resolve-back': resolveBack(); break;
    case 'resolve-continue': applyVoteOutcome(); break;
    case 'next-night': goNextNight(); break;
    case 'save-history': saveToHistory(); break;

    case 'open-special': g.dayPending.specialAction=el.getAttribute('data-kind'); g.dayPending.gravekeeperResult=null; render(); break;
    case 'special-cancel': g.dayPending.specialAction=null; render(); break;
    case 'special-baiwang-target': {
      const v=el.getAttribute('data-seat'); if(v==='null') break;
      if(!confirm('确定要自爆并带走这名玩家吗？此操作不可撤销。')) break;
      const target=Number(v); const king=livingOfRole(g,'白狼王');
      killSeat(g,king.seat,'自爆',g.day); killSeat(g,target,'白狼王带走',g.day);
      g.dayPending.specialAction=null; checkWin(g);
      if(!g.winner) beginNight(g);
      saveDB(); render(); break;
    }
    case 'special-moonapostle-confirm': {
      if(!confirm('确定要自爆吗？此操作不可撤销。')) break;
      g.moonApostleSkipNextNight=true; g.moonApostleCannotPoint=true;
      g.dayPending.specialAction=null;
      beginNight(g);
      saveDB(); render(); break;
    }
    case 'special-knight-target': {
      const v=el.getAttribute('data-seat'); if(v==='null') break;
      const target=Number(v); const kn=livingOfRole(g,'骑士');
      if(campOf(seatBy(g,target).role)==='wolf'){ killSeat(g,target,'骑士决斗击杀',g.day); }
      else { killSeat(g,kn.seat,'决斗落败出局',g.day); }
      g.knightUsed=true; g.dayPending.specialAction=null; checkWin(g); saveDB(); render(); break;
    }
    case 'special-gravekeeper-pick': {
      const sn=Number(el.getAttribute('data-seat'));
      g.dayPending.gravekeeperTarget=sn; g.dayPending.gravekeeperResult=seatBy(g,sn).role; g.gravekeeperLastUsedDay=g.day;
      saveDB(); render(); break;
    }
  }
}

/* ============ 强制结束弹窗（简单 confirm 实现） ============ */
function openForceEndModal(){
  openSheet({title:'结束本局？', message:'本局会立即结束，并按你选择的一方判定胜负。结果会存入历史记录，无法撤销。',
    actions:[{label:'好人阵营获胜', onPick:function(){ forceEndGame('好人阵营'); }},
             {label:'狼人阵营获胜', kind:'danger', onPick:function(){ forceEndGame('狼人阵营'); }},
             {label:'取消'}]});
}

/* ============ 启动 ============ */
initSky();
initExtras();
render();
</script>
